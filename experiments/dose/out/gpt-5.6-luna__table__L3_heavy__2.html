<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory</title>
  <style>
    :root {
      --color-page: #f4f7fb;
      --color-surface: #ffffff;
      --color-text: #172033;
      --color-muted: #526174;
      --color-border: #cbd5e1;
      --color-primary: #174a7c;
      --color-primary-dark: #0f355b;
      --color-primary-soft: #e7f0fa;
      --color-focus: #e07a00;
      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --radius: 0.625rem;
      --shadow: 0 0.25rem 1rem rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--color-page);
      color: var(--color-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button:focus-visible, input:focus-visible {
      outline: 0.2rem solid var(--color-focus);
      outline-offset: 0.15rem;
    }

    .page-shell {
      width: min(100% - 2rem, 78rem);
      margin: 0 auto;
      padding: var(--space-5) 0;
    }

    .page-header { margin-bottom: var(--space-4); }
    .page-header__eyebrow {
      margin: 0 0 var(--space-1);
      color: var(--color-primary);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .page-header h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.15;
    }
    .page-header__description { margin: var(--space-1) 0 0; color: var(--color-muted); }

    .directory {
      overflow: hidden;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .directory__toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: var(--space-3);
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }

    .field { display: grid; gap: var(--space-1); min-width: min(100%, 20rem); }
    .field__label, .checkbox-field__label { font-weight: 700; }
    .field input[type="search"] {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.55rem 0.75rem;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid #718096;
      border-radius: 0.375rem;
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-height: 2.75rem;
      padding-bottom: 0.25rem;
    }
    .checkbox-field input { width: 1.15rem; height: 1.15rem; accent-color: var(--color-primary); }

    .button {
      min-height: 2.75rem;
      padding: 0.55rem 1rem;
      color: #fff;
      background: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 700;
    }
    .button:hover:not(:disabled) { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
    .button:disabled { cursor: not-allowed; opacity: 0.55; }
    .toolbar__action { margin-left: auto; }

    .table-region { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 42rem; }
    caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    th, td { padding: 0.9rem 1rem; text-align: left; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    th {
      color: var(--color-text);
      background: #eef3f8;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }
    th[data-sort-key] { padding: 0; }
    .sort-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      width: 100%;
      min-height: 3rem;
      padding: 0.75rem 1rem;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-weight: inherit;
      text-align: left;
    }
    .sort-button:hover { background: var(--color-primary-soft); }
    .sort-indicator { min-width: 1.25rem; color: var(--color-primary); font-size: 0.9rem; }
    tbody tr:hover { background: #f8fbff; }
    tbody tr:last-child td { border-bottom: 0; }
    .status { font-weight: 700; }
    .status--active { color: #17643a; }
    .status--inactive { color: #7a2430; }

    .directory__footer { padding: var(--space-3) var(--space-4) var(--space-4); }
    .directory__status { margin: 0 0 var(--space-3); color: var(--color-muted); font-weight: 600; }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .pagination__indicator { min-width: 7rem; color: var(--color-text); font-weight: 700; text-align: center; }
    .empty-state { padding: var(--space-5); color: var(--color-muted); text-align: center; }

    @media (max-width: 44rem) {
      .page-shell { width: min(100% - 1rem, 78rem); padding: var(--space-4) 0; }
      .directory__toolbar, .directory__footer { padding: var(--space-3); }
      .field { width: 100%; min-width: 0; }
      .toolbar__action { width: 100%; margin-left: 0; }
      .pagination { flex-wrap: wrap; justify-content: center; }
      .pagination__indicator { order: -1; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="page-header__eyebrow">People operations</p>
      <h1>Employee directory</h1>
      <p class="page-header__description">Browse, filter, sort, and export employee records.</p>
    </header>

    <section class="directory" aria-labelledby="directory-title">
      <h2 id="directory-title" hidden>Employee records</h2>
      <div class="directory__toolbar">
        <div class="field">
          <label class="field__label" for="employee-search">Search by name or department</label>
          <input id="employee-search" type="search" placeholder="e.g. Engineering or Maya" autocomplete="off">
        </div>
        <div class="checkbox-field">
          <input id="active-only" type="checkbox">
          <label class="checkbox-field__label" for="active-only">Active only</label>
        </div>
        <button class="button toolbar__action" id="export-button" type="button">Export CSV</button>
      </div>

      <div class="table-region">
        <table>
          <caption>Employee records with sortable columns</caption>
          <thead>
            <tr>
              <th scope="col" data-sort-key="name"><button class="sort-button" type="button">Name <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" data-sort-key="department"><button class="sort-button" type="button">Department <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" data-sort-key="salary"><button class="sort-button" type="button">Salary <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" data-sort-key="startDate"><button class="sort-button" type="button">Start date <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" data-sort-key="active"><button class="sort-button" type="button">Status <span class="sort-indicator" aria-hidden="true"></span></button></th>
            </tr>
          </thead>
          <tbody id="employee-body"></tbody>
        </table>
      </div>

      <footer class="directory__footer">
        <p class="directory__status" id="row-count" aria-live="polite"></p>
        <nav class="pagination" aria-label="Employee table pagination">
          <button class="button" id="previous-button" type="button">Previous</button>
          <span class="pagination__indicator" id="page-indicator" aria-live="polite"></span>
          <button class="button" id="next-button" type="button">Next</button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const EMPLOYEES = [
        { name: 'Maya Chen', department: 'Engineering', salary: 124000, startDate: '2021-03-15', active: true },
        { name: 'Ethan Brooks', department: 'Sales', salary: 98000, startDate: '2022-07-11', active: true },
        { name: 'Olivia Patel', department: 'Support', salary: 76000, startDate: '2020-11-02', active: true },
        { name: 'Liam Garcia', department: 'Design', salary: 105000, startDate: '2019-05-20', active: false },
        { name: 'Noah Williams', department: 'Engineering', salary: 137000, startDate: '2018-09-04', active: true },
        { name: 'Sophia Kim', department: 'Sales', salary: 112000, startDate: '2023-01-09', active: true },
        { name: 'James Wilson', department: 'Support', salary: 72000, startDate: '2021-08-23', active: false },
        { name: 'Ava Thompson', department: 'Design', salary: 94000, startDate: '2022-02-14', active: true },
        { name: 'Lucas Martin', department: 'Engineering', salary: 119000, startDate: '2020-06-29', active: true },
        { name: 'Isabella Davis', department: 'Sales', salary: 101000, startDate: '2019-12-16', active: false },
        { name: 'Benjamin Lee', department: 'Support', salary: 81000, startDate: '2023-04-03', active: true },
        { name: 'Mia Anderson', department: 'Design', salary: 108000, startDate: '2021-01-25', active: true },
        { name: 'Henry Clark', department: 'Engineering', salary: 131000, startDate: '2017-10-30', active: true },
        { name: 'Charlotte Lewis', department: 'Sales', salary: 89000, startDate: '2020-03-09', active: true },
        { name: 'Daniel Walker', department: 'Support', salary: 69500, startDate: '2022-09-19', active: true },
        { name: 'Amelia Hall', department: 'Design', salary: 99000, startDate: '2018-04-17', active: false },
        { name: 'Michael Allen', department: 'Engineering', salary: 146000, startDate: '2016-07-12', active: true },
        { name: 'Harper Young', department: 'Sales', salary: 117000, startDate: '2021-11-08', active: true },
        { name: 'Alexander Hernandez', department: 'Support', salary: 78500, startDate: '2019-08-26', active: false },
        { name: 'Evelyn King', department: 'Design', salary: 113000, startDate: '2023-06-05', active: true },
        { name: 'Sebastian Wright', department: 'Engineering', salary: 128000, startDate: '2022-05-16', active: true },
        { name: 'Abigail Lopez', department: 'Sales', salary: 93000, startDate: '2020-10-12', active: false },
        { name: 'Matthew Hill', department: 'Support', salary: 74500, startDate: '2021-04-27', active: true },
        { name: 'Emily Scott', department: 'Design', salary: 102000, startDate: '2019-02-18', active: true }
      ];

      const ROWS_PER_PAGE = 10;
      const SORT_ASCENDING = 'ascending';
      const SORT_DESCENDING = 'descending';
      const state = { query: '', activeOnly: false, page: 1, sortKey: 'name', sortDirection: SORT_ASCENDING };

      const elements = {
        search: document.querySelector('#employee-search'),
        activeOnly: document.querySelector('#active-only'),
        exportButton: document.querySelector('#export-button'),
        body: document.querySelector('#employee-body'),
        rowCount: document.querySelector('#row-count'),
        pageIndicator: document.querySelector('#page-indicator'),
        previous: document.querySelector('#previous-button'),
        next: document.querySelector('#next-button'),
        sortHeaders: [...document.querySelectorAll('[data-sort-key]')]
      };

      const formatCurrency = (salary) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(salary);
      const formatDate = (date) => new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeZone: 'UTC' }).format(new Date(`${date}T00:00:00Z`));
      const normalize = (value) => String(value).toLocaleLowerCase().trim();

      function getFilteredEmployees() {
        const query = normalize(state.query);
        return EMPLOYEES.filter((employee) => {
          const matchesText = !query || normalize(`${employee.name} ${employee.department}`).includes(query);
          const matchesStatus = !state.activeOnly || employee.active;
          return matchesText && matchesStatus;
        });
      }

      function getSortedEmployees(employees) {
        return [...employees].sort((first, second) => {
          const firstValue = first[state.sortKey];
          const secondValue = second[state.sortKey];
          let comparison = 0;
          if (typeof firstValue === 'number' || typeof firstValue === 'boolean') {
            comparison = Number(firstValue) - Number(secondValue);
          } else {
            comparison = String(firstValue).localeCompare(String(secondValue), undefined, { sensitivity: 'base' });
          }
          return state.sortDirection === SORT_ASCENDING ? comparison : -comparison;
        });
      }

      function makeCell(text, className = '') {
        const cell = document.createElement('td');
        cell.textContent = text;
        if (className) cell.className = className;
        return cell;
      }

      function renderRows(pageEmployees) {
        elements.body.replaceChildren();
        if (pageEmployees.length === 0) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 5;
          cell.className = 'empty-state';
          cell.textContent = 'No employees match the current filters.';
          row.append(cell);
          elements.body.append(row);
          return;
        }
        const fragment = document.createDocumentFragment();
        pageEmployees.forEach((employee) => {
          const row = document.createElement('tr');
          row.append(
            makeCell(employee.name),
            makeCell(employee.department),
            makeCell(formatCurrency(employee.salary)),
            makeCell(formatDate(employee.startDate)),
            makeCell(employee.active ? 'Active' : 'Inactive', `status ${employee.active ? 'status--active' : 'status--inactive'}`)
          );
          fragment.append(row);
        });
        elements.body.append(fragment);
      }

      function updateSortIndicators() {
        elements.sortHeaders.forEach((header) => {
          const indicator = header.querySelector('.sort-indicator');
          const button = header.querySelector('.sort-button');
          const isCurrent = header.dataset.sortKey === state.sortKey;
          indicator.textContent = isCurrent ? (state.sortDirection === SORT_ASCENDING ? '▲' : '▼') : '';
          button.setAttribute('aria-label', `Sort by ${button.firstChild.textContent.trim()} ${isCurrent ? `(currently ${state.sortDirection})` : ''}`.trim());
          header.setAttribute('aria-sort', isCurrent ? state.sortDirection : 'none');
        });
      }

      function render() {
        const filteredEmployees = getFilteredEmployees();
        const sortedEmployees = getSortedEmployees(filteredEmployees);
        const totalPages = Math.max(1, Math.ceil(sortedEmployees.length / ROWS_PER_PAGE));
        state.page = Math.min(state.page, totalPages);
        const startIndex = (state.page - 1) * ROWS_PER_PAGE;
        const pageEmployees = sortedEmployees.slice(startIndex, startIndex + ROWS_PER_PAGE);
        const startDisplay = sortedEmployees.length === 0 ? 0 : startIndex + 1;
        const endDisplay = sortedEmployees.length === 0 ? 0 : Math.min(startIndex + ROWS_PER_PAGE, sortedEmployees.length);

        renderRows(pageEmployees);
        elements.rowCount.textContent = `Showing ${startDisplay}-${endDisplay} of ${sortedEmployees.length}`;
        elements.pageIndicator.textContent = `Page ${state.page} of ${totalPages}`;
        elements.previous.disabled = state.page === 1;
        elements.next.disabled = state.page === totalPages;
        elements.previous.title = state.page === 1 ? 'Already on the first page' : 'Go to the previous page';
        elements.next.title = state.page === totalPages ? 'Already on the last page' : 'Go to the next page';
        updateSortIndicators();
      }

      function resetToFirstPage() { state.page = 1; render(); }

      function escapeCsv(value) {
        const stringValue = String(value);
        return /[",\n\r]/.test(stringValue) ? `"${stringValue.replaceAll('"', '""')}"` : stringValue;
      }

      function exportCsv() {
        const filteredEmployees = getSortedEmployees(getFilteredEmployees());
        const headers = ['Name', 'Department', 'Salary', 'Start Date', 'Active'];
        const rows = filteredEmployees.map((employee) => [employee.name, employee.department, employee.salary, employee.startDate, employee.active ? 'Yes' : 'No']);
        const csv = [headers, ...rows].map((row) => row.map(escapeCsv).join(',')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'filtered-employees.csv';
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      elements.search.addEventListener('input', (event) => { state.query = event.target.value; resetToFirstPage(); });
      elements.activeOnly.addEventListener('change', (event) => { state.activeOnly = event.target.checked; resetToFirstPage(); });
      elements.previous.addEventListener('click', () => { if (state.page > 1) { state.page -= 1; render(); } });
      elements.next.addEventListener('click', () => {
        const totalPages = Math.max(1, Math.ceil(getFilteredEmployees().length / ROWS_PER_PAGE));
        if (state.page < totalPages) { state.page += 1; render(); }
      });
      elements.exportButton.addEventListener('click', exportCsv);
      elements.sortHeaders.forEach((header) => header.querySelector('.sort-button').addEventListener('click', () => {
        const sortKey = header.dataset.sortKey;
        if (state.sortKey === sortKey) {
          state.sortDirection = state.sortDirection === SORT_ASCENDING ? SORT_DESCENDING : SORT_ASCENDING;
        } else {
          state.sortKey = sortKey;
          state.sortDirection = SORT_ASCENDING;
        }
        state.page = 1;
        render();
      }));

      render();
    })();
  </script>
</body>
</html>
