<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #687385;
      --line: #dfe5ee;
      --surface: #ffffff;
      --surface-alt: #f7f9fc;
      --accent: #315efb;
      --accent-dark: #2549c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f2f5f9;
    }
    .wrap { max-width: 1050px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 3vw, 2.25rem); letter-spacing: -0.03em; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 26px rgba(25, 39, 67, .06); overflow: hidden; }
    .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .search-wrap { flex: 1 1 290px; }
    label.search-label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input[type="search"] { width: 100%; padding: 10px 12px; border: 1px solid #cbd3df; border-radius: 8px; font: inherit; color: var(--ink); outline: none; }
    input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49, 94, 251, .14); }
    .active-control { display: flex; align-items: center; gap: 8px; margin-top: 21px; white-space: nowrap; font-weight: 600; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
    button { border: 1px solid #cbd3df; background: white; color: var(--ink); border-radius: 8px; padding: 10px 14px; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { margin-top: 21px; background: var(--accent); border-color: var(--accent); color: white; }
    .primary:hover:not(:disabled) { background: var(--accent-dark); color: white; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 680px; }
    th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--line); }
    th { background: var(--surface-alt); color: #4d5a6c; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
    th button.sort-button { padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
    th button.sort-button:hover { color: var(--accent); }
    .sort-indicator { display: inline-block; min-width: 14px; margin-left: 3px; color: var(--accent); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfcff; }
    .salary { font-variant-numeric: tabular-nums; }
    .status { display: inline-flex; align-items: center; gap: 6px; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #aab3c0; }
    .status.active::before { background: #1da66b; }
    .empty { text-align: center; color: var(--muted); padding: 38px 20px; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 20px; border-top: 1px solid var(--line); }
    #rowCount { color: var(--muted); font-size: .93rem; }
    .pagination { display: flex; align-items: center; gap: 10px; }
    #pageInfo { min-width: 90px; text-align: center; font-size: .92rem; color: var(--muted); }
    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      .toolbar, .footer { padding: 15px; }
      .primary, .active-control { margin-top: 0; }
      th, td { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Employee Directory</h1>
    <p class="subtitle">Browse, filter, and export employee records.</p>
    <section class="card" aria-label="Employee data table">
      <div class="toolbar">
        <div class="search-wrap">
          <label class="search-label" for="filterInput">Search by name or department</label>
          <input id="filterInput" type="search" placeholder="e.g. Engineering or Taylor" autocomplete="off">
        </div>
        <label class="active-control"><input id="activeOnly" type="checkbox"> Active only</label>
        <button id="exportButton" class="primary" type="button">Export CSV</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th><button class="sort-button" data-key="name" type="button">Name <span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th><button class="sort-button" data-key="department" type="button">Department <span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th><button class="sort-button" data-key="salary" type="button">Salary <span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th><button class="sort-button" data-key="startDate" type="button">Start date <span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th><button class="sort-button" data-key="active" type="button">Status <span class="sort-indicator" aria-hidden="true"></span></button></th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="footer">
        <div id="rowCount" aria-live="polite">Showing 0-0 of 0</div>
        <div class="pagination">
          <button id="previousButton" type="button">Previous</button>
          <span id="pageInfo" aria-live="polite">Page 1 of 1</span>
          <button id="nextButton" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const employees = [
      { name: "Avery Chen", department: "Engineering", salary: 118500, startDate: "2021-03-15", active: true },
      { name: "Maya Patel", department: "Sales", salary: 92400, startDate: "2022-07-11", active: true },
      { name: "Jordan Brooks", department: "Support", salary: 76500, startDate: "2020-11-02", active: true },
      { name: "Elena Rodriguez", department: "Design", salary: 101200, startDate: "2019-05-20", active: false },
      { name: "Liam Foster", department: "Engineering", salary: 132000, startDate: "2018-01-08", active: true },
      { name: "Nora Williams", department: "Sales", salary: 88700, startDate: "2023-02-13", active: true },
      { name: "Marcus Lee", department: "Support", salary: 71400, startDate: "2021-09-27", active: false },
      { name: "Sofia Bennett", department: "Design", salary: 97300, startDate: "2022-04-04", active: true },
      { name: "Ethan Wallace", department: "Engineering", salary: 124800, startDate: "2020-06-22", active: true },
      { name: "Priya Shah", department: "Sales", salary: 109600, startDate: "2017-10-16", active: true },
      { name: "Caleb Turner", department: "Support", salary: 68200, startDate: "2023-08-01", active: true },
      { name: "Isla Morgan", department: "Design", salary: 116900, startDate: "2018-12-03", active: false },
      { name: "Oliver Grant", department: "Engineering", salary: 145500, startDate: "2016-04-18", active: true },
      { name: "Zoe Kim", department: "Sales", salary: 83200, startDate: "2021-01-25", active: false },
      { name: "Henry Adams", department: "Support", salary: 79800, startDate: "2019-09-09", active: true },
      { name: "Amara Johnson", department: "Design", salary: 105400, startDate: "2020-02-10", active: true },
      { name: "Theo Martin", department: "Engineering", salary: 127700, startDate: "2022-10-31", active: true },
      { name: "Grace Wilson", department: "Sales", salary: 95600, startDate: "2018-07-30", active: true },
      { name: "Daniel Park", department: "Support", salary: 73900, startDate: "2022-12-12", active: false },
      { name: "Ruby Thompson", department: "Design", salary: 99800, startDate: "2021-06-14", active: true },
      { name: "Samuel Reed", department: "Engineering", salary: 138600, startDate: "2017-03-06", active: false },
      { name: "Layla Scott", department: "Sales", salary: 118900, startDate: "2019-11-18", active: true },
      { name: "Noah Carter", department: "Support", salary: 85600, startDate: "2020-08-24", active: true },
      { name: "Chloe Evans", department: "Design", salary: 110300, startDate: "2023-05-08", active: true }
    ];

    const pageSize = 10;
    let page = 1;
    let sortKey = "name";
    let sortDirection = "asc";
    const filterInput = document.getElementById("filterInput");
    const activeOnly = document.getElementById("activeOnly");
    const tableBody = document.getElementById("tableBody");
    const rowCount = document.getElementById("rowCount");
    const pageInfo = document.getElementById("pageInfo");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    function filteredRows() {
      const query = filterInput.value.trim().toLowerCase();
      return employees.filter(employee => {
        const matchesText = !query || employee.name.toLowerCase().includes(query) || employee.department.toLowerCase().includes(query);
        return matchesText && (!activeOnly.checked || employee.active);
      });
    }

    function sortedRows(rows) {
      return [...rows].sort((a, b) => {
        let comparison;
        if (sortKey === "salary") comparison = a.salary - b.salary;
        else if (sortKey === "active") comparison = Number(a.active) - Number(b.active);
        else comparison = String(a[sortKey]).localeCompare(String(b[sortKey]), undefined, { numeric: true });
        return comparison * (sortDirection === "asc" ? 1 : -1);
      });
    }

    function formatDate(isoDate) {
      return new Date(isoDate + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function render() {
      const rows = sortedRows(filteredRows());
      const total = rows.length;
      const pageCount = Math.max(1, Math.ceil(total / pageSize));
      page = Math.min(page, pageCount);
      const start = (page - 1) * pageSize;
      const visible = rows.slice(start, start + pageSize);
      tableBody.innerHTML = visible.length ? visible.map(employee => `
        <tr>
          <td>${employee.name}</td><td>${employee.department}</td>
          <td class="salary">$${employee.salary.toLocaleString()}</td>
          <td>${formatDate(employee.startDate)}</td>
          <td><span class="status ${employee.active ? "active" : ""}">${employee.active ? "Active" : "Inactive"}</span></td>
        </tr>`).join("") : '<tr><td class="empty" colspan="5">No employees match the current filters.</td></tr>';
      rowCount.textContent = total ? `Showing ${start + 1}-${Math.min(start + pageSize, total)} of ${total}` : "Showing 0-0 of 0";
      pageInfo.textContent = `Page ${page} of ${pageCount}`;
      previousButton.disabled = page === 1;
      nextButton.disabled = page === pageCount;
      document.querySelectorAll(".sort-button").forEach(button => {
        const indicator = button.querySelector(".sort-indicator");
        const isCurrent = button.dataset.key === sortKey;
        indicator.textContent = isCurrent ? (sortDirection === "asc" ? "▲" : "▼") : "";
        button.setAttribute("aria-label", `Sort by ${button.dataset.key}, ${isCurrent ? sortDirection : "not currently sorted"}`);
      });
    }

    filterInput.addEventListener("input", () => { page = 1; render(); });
    activeOnly.addEventListener("change", () => { page = 1; render(); });
    previousButton.addEventListener("click", () => { if (page > 1) { page--; render(); } });
    nextButton.addEventListener("click", () => { page++; render(); });
    document.querySelectorAll(".sort-button").forEach(button => button.addEventListener("click", () => {
      if (sortKey === button.dataset.key) sortDirection = sortDirection === "asc" ? "desc" : "asc";
      else { sortKey = button.dataset.key; sortDirection = "asc"; }
      page = 1;
      render();
    }));

    function csvEscape(value) {
      const text = String(value);
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }
    document.getElementById("exportButton").addEventListener("click", () => {
      const csvRows = [
        ["Name", "Department", "Salary", "Start Date", "Active"],
        ...sortedRows(filteredRows()).map(employee => [employee.name, employee.department, employee.salary, employee.startDate, employee.active ? "Yes" : "No"])
      ];
      const csv = csvRows.map(row => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "employees.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    render();
  </script>
</body>
</html>
