<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everyday Science Quiz</title>
  <style>
    :root {
      --color-ink: #17233c;
      --color-muted: #526078;
      --color-surface: #ffffff;
      --color-page: #f3f6fb;
      --color-border: #c8d2e2;
      --color-primary: #2458a6;
      --color-primary-dark: #163d79;
      --color-accent: #e6efff;
      --color-success: #17683b;
      --color-error: #a32626;
      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --radius: 0.75rem;
      --shadow: 0 0.5rem 1.5rem rgba(23, 35, 60, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 18rem;
      color: var(--color-ink);
      background: var(--color-page);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    .quiz-page {
      width: min(100% - 2rem, 52rem);
      margin: 0 auto;
      padding: var(--space-5) 0 3rem;
    }

    .quiz-header {
      margin-bottom: var(--space-4);
      text-align: center;
    }

    .quiz-header__eyebrow {
      margin: 0 0 var(--space-1);
      color: var(--color-primary);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    h2 { margin: 0; font-size: 1.25rem; }

    .quiz-card {
      overflow: hidden;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .quiz-card__body { padding: clamp(1rem, 4vw, 2rem); }

    .quiz-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
      color: var(--color-muted);
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .quiz-status__count { white-space: nowrap; }

    .progress {
      height: 0.625rem;
      overflow: hidden;
      background: #dce4f0;
      border-radius: 99rem;
    }

    .progress__bar {
      width: 0%;
      height: 100%;
      background: var(--color-primary);
      border-radius: inherit;
      transition: width 180ms ease-out;
    }

    .question {
      margin: 0 0 var(--space-5);
      padding: 0;
      border: 0;
    }

    .question__legend {
      display: block;
      margin-bottom: var(--space-3);
      font-size: 1.125rem;
      font-weight: 700;
    }

    .question__number { color: var(--color-primary); }

    .options {
      display: grid;
      gap: var(--space-2);
    }

    .option { position: relative; }

    .option__input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .option__label {
      display: block;
      padding: var(--space-2) var(--space-3);
      border: 2px solid var(--color-border);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease;
    }

    .option__label:hover { border-color: var(--color-primary); }
    .option__input:checked + .option__label {
      border-color: var(--color-primary);
      background: var(--color-accent);
      font-weight: 650;
    }

    .option__input:focus-visible + .option__label {
      outline: 3px solid #f0a900;
      outline-offset: 3px;
    }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border);
    }

    .button {
      min-height: 2.75rem;
      padding: 0.625rem 1.125rem;
      border: 2px solid transparent;
      border-radius: 0.5rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .button:focus-visible {
      outline: 3px solid #f0a900;
      outline-offset: 3px;
    }

    .button--primary { color: #fff; background: var(--color-primary); }
    .button--primary:hover:not(:disabled) { background: var(--color-primary-dark); }
    .button--primary:disabled { color: #68758a; background: #dce2eb; cursor: not-allowed; }
    .button--secondary { color: var(--color-primary-dark); background: transparent; border-color: var(--color-primary); }
    .button--secondary:hover { background: var(--color-accent); }

    .results {
      margin-top: var(--space-4);
      padding: var(--space-4);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius);
      background: #f8fbff;
    }

    .results__score { margin: 0 0 var(--space-3); color: var(--color-primary-dark); font-size: 1.5rem; }
    .results__message { margin: 0 0 var(--space-3); color: var(--color-muted); }
    .results__heading { margin: var(--space-4) 0 var(--space-2); font-size: 1.125rem; }
    .wrong-answer { margin: 0 0 var(--space-3); padding: var(--space-3); border-left: 4px solid var(--color-error); background: #fff5f5; }
    .wrong-answer p { margin: 0.25rem 0; }
    .wrong-answer__label { font-weight: 700; }
    .results[hidden] { display: none; }

    .quiz-footer { margin-top: var(--space-3); color: var(--color-muted); text-align: center; font-size: 0.875rem; }

    @media (max-width: 30rem) {
      .quiz-page { width: min(100% - 1rem, 52rem); padding-top: var(--space-4); }
      .quiz-card__body { padding: var(--space-3); }
      .quiz-status { align-items: flex-start; flex-direction: column; gap: var(--space-1); }
      .progress { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="quiz-page">
    <header class="quiz-header">
      <p class="quiz-header__eyebrow">Knowledge check</p>
      <h1>Everyday Science Quiz</h1>
    </header>

    <section class="quiz-card" aria-labelledby="quiz-title">
      <div class="quiz-card__body">
        <h2 id="quiz-title" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Five-question quiz</h2>
        <div class="quiz-status">
          <span>Progress</span>
          <span id="progress-count" class="quiz-status__count" aria-live="polite">0 of 5 answered</span>
        </div>
        <div class="progress" role="progressbar" aria-label="Quiz completion" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
          <div id="progress-bar" class="progress__bar"></div>
        </div>

        <form id="quiz-form" novalidate>
          <div id="questions"></div>
          <div class="quiz-actions">
            <button id="submit-button" class="button button--primary" type="submit" disabled>Submit answers</button>
            <button id="retry-button" class="button button--secondary" type="button" hidden>Retry quiz</button>
          </div>
        </form>

        <section id="results" class="results" aria-labelledby="results-title" aria-live="polite" hidden>
          <h2 id="results-title" class="results__score"></h2>
          <p id="results-message" class="results__message"></p>
          <div id="wrong-answers"></div>
        </section>
      </div>
    </section>

    <footer class="quiz-footer">Choose one answer for each question, then submit when you are ready.</footer>
  </main>

  <script>
    (() => {
      'use strict';

      const QUESTIONS = [
        { text: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Mercury'], answer: 1 },
        { text: 'What process do plants use to convert light into chemical energy?', options: ['Respiration', 'Fermentation', 'Photosynthesis', 'Digestion'], answer: 2 },
        { text: 'Which gas makes up the largest share of Earth’s atmosphere?', options: ['Oxygen', 'Carbon dioxide', 'Hydrogen', 'Nitrogen'], answer: 3 },
        { text: 'How many bones are in the adult human body, approximately?', options: ['106', '206', '306', '406'], answer: 1 },
        { text: 'What is the boiling point of water at sea level?', options: ['50°C', '75°C', '100°C', '150°C'], answer: 2 }
      ];
      const TOTAL_QUESTIONS = QUESTIONS.length;
      const form = document.querySelector('#quiz-form');
      const questionsContainer = document.querySelector('#questions');
      const submitButton = document.querySelector('#submit-button');
      const retryButton = document.querySelector('#retry-button');
      const progressCount = document.querySelector('#progress-count');
      const progressBar = document.querySelector('#progress-bar');
      const progressTrack = document.querySelector('.progress');
      const results = document.querySelector('#results');
      const resultsTitle = document.querySelector('#results-title');
      const resultsMessage = document.querySelector('#results-message');
      const wrongAnswers = document.querySelector('#wrong-answers');

      function renderQuestions() {
        questionsContainer.innerHTML = QUESTIONS.map((question, questionIndex) => `
          <fieldset class="question">
            <legend class="question__legend"><span class="question__number">${questionIndex + 1}.</span> ${question.text}</legend>
            <div class="options">
              ${question.options.map((option, optionIndex) => `
                <div class="option">
                  <input class="option__input" type="radio" id="question-${questionIndex}-option-${optionIndex}" name="question-${questionIndex}" value="${optionIndex}">
                  <label class="option__label" for="question-${questionIndex}-option-${optionIndex}">${option}</label>
                </div>
              `).join('')}
            </div>
          </fieldset>
        `).join('');
      }

      function getAnsweredCount() {
        return QUESTIONS.filter((_, index) => form.querySelector(`input[name="question-${index}"]:checked`)).length;
      }

      function updateProgress() {
        const answeredCount = getAnsweredCount();
        const percentage = (answeredCount / TOTAL_QUESTIONS) * 100;
        progressCount.textContent = `${answeredCount} of ${TOTAL_QUESTIONS} answered`;
        progressBar.style.width = `${percentage}%`;
        progressTrack.setAttribute('aria-valuenow', String(answeredCount));
        submitButton.disabled = answeredCount !== TOTAL_QUESTIONS;
      }

      function getSelections() {
        return QUESTIONS.map((_, index) => {
          const selected = form.querySelector(`input[name="question-${index}"]:checked`);
          return selected ? Number(selected.value) : null;
        });
      }

      function showResults() {
        const selections = getSelections();
        const incorrect = QUESTIONS.map((question, index) => ({ question, index, selected: selections[index] }))
          .filter(({ question, selected }) => selected !== question.answer);
        const score = TOTAL_QUESTIONS - incorrect.length;

        resultsTitle.textContent = `You scored ${score}/${TOTAL_QUESTIONS}`;
        resultsMessage.textContent = incorrect.length === 0
          ? 'Excellent work — every answer is correct.'
          : 'Review the answers below to see what to revisit.';
        wrongAnswers.innerHTML = incorrect.length === 0 ? '' : `
          <h3 class="results__heading">Questions to review</h3>
          ${incorrect.map(({ question, selected, index }) => `
            <article class="wrong-answer">
              <p><span class="wrong-answer__label">Question ${index + 1}:</span> ${question.text}</p>
              <p><span class="wrong-answer__label">Your answer:</span> ${selected === null ? 'No answer' : question.options[selected]}</p>
              <p><span class="wrong-answer__label">Correct answer:</span> ${question.options[question.answer]}</p>
            </article>
          `).join('')}
        `;
        results.hidden = false;
        retryButton.hidden = false;
        results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function resetQuiz() {
        form.reset();
        results.hidden = true;
        retryButton.hidden = true;
        wrongAnswers.innerHTML = '';
        updateProgress();
        questionsContainer.querySelector('input')?.focus();
      }

      renderQuestions();
      form.addEventListener('change', updateProgress);
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (getAnsweredCount() === TOTAL_QUESTIONS) showResults();
      });
      retryButton.addEventListener('click', resetQuiz);
      updateProgress();
    })();
  </script>
</body>
</html>
