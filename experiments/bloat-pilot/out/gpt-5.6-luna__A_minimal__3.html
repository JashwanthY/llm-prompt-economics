<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --background: #f3f4f6;
      --card: #ffffff;
      --correct: #166534;
      --incorrect: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.5;
    }

    main {
      width: min(720px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    .quiz-card {
      background: var(--card);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .progress {
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0 0 1.25rem;
      padding: 1rem;
    }

    legend {
      font-weight: 700;
      padding: 0 0.35rem;
    }

    .option {
      display: block;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.8rem;
      margin-top: 0.6rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option:hover,
    .option:has(input:focus-visible) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option input {
      margin-right: 0.55rem;
      accent-color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 0.7rem 1.1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #submit {
      color: white;
      background: var(--primary);
    }

    #submit:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    #submit:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #retry {
      color: var(--text);
      background: #e5e7eb;
    }

    #retry:hover {
      background: #d1d5db;
    }

    #results {
      border-top: 1px solid var(--border);
      margin-top: 2rem;
      padding-top: 1.5rem;
    }

    #results h2 {
      margin-top: 0;
    }

    .wrong-answer {
      border-left: 4px solid var(--incorrect);
      background: #fef2f2;
      margin: 1rem 0;
      padding: 0.8rem 1rem;
    }

    .wrong-answer p {
      margin: 0.25rem 0;
    }

    .correct {
      color: var(--correct);
      font-weight: 700;
    }

    .incorrect {
      color: var(--incorrect);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section class="quiz-card" aria-labelledby="quiz-title">
      <h1 id="quiz-title">General Knowledge Quiz</h1>
      <p id="progress" class="progress" aria-live="polite">0 of 5 answered</p>

      <form id="quiz-form">
        <fieldset data-correct="1">
          <legend>Which planet is known as the Red Planet?</legend>
          <label class="option"><input type="radio" name="q1" value="0"> Venus</label>
          <label class="option"><input type="radio" name="q1" value="1"> Mars</label>
          <label class="option"><input type="radio" name="q1" value="2"> Jupiter</label>
          <label class="option"><input type="radio" name="q1" value="3"> Mercury</label>
        </fieldset>

        <fieldset data-correct="2">
          <legend>What is the largest ocean on Earth?</legend>
          <label class="option"><input type="radio" name="q2" value="0"> Atlantic Ocean</label>
          <label class="option"><input type="radio" name="q2" value="1"> Indian Ocean</label>
          <label class="option"><input type="radio" name="q2" value="2"> Pacific Ocean</label>
          <label class="option"><input type="radio" name="q2" value="3"> Arctic Ocean</label>
        </fieldset>

        <fieldset data-correct="0">
          <legend>Who wrote <em>Romeo and Juliet</em>?</legend>
          <label class="option"><input type="radio" name="q3" value="0"> William Shakespeare</label>
          <label class="option"><input type="radio" name="q3" value="1"> Charles Dickens</label>
          <label class="option"><input type="radio" name="q3" value="2"> Jane Austen</label>
          <label class="option"><input type="radio" name="q3" value="3"> Mark Twain</label>
        </fieldset>

        <fieldset data-correct="3">
          <legend>How many sides does a hexagon have?</legend>
          <label class="option"><input type="radio" name="q4" value="0"> Five</label>
          <label class="option"><input type="radio" name="q4" value="1"> Seven</label>
          <label class="option"><input type="radio" name="q4" value="2"> Eight</label>
          <label class="option"><input type="radio" name="q4" value="3"> Six</label>
        </fieldset>

        <fieldset data-correct="1">
          <legend>Which gas do plants primarily absorb from the atmosphere?</legend>
          <label class="option"><input type="radio" name="q5" value="0"> Oxygen</label>
          <label class="option"><input type="radio" name="q5" value="1"> Carbon dioxide</label>
          <label class="option"><input type="radio" name="q5" value="2"> Nitrogen</label>
          <label class="option"><input type="radio" name="q5" value="3"> Hydrogen</label>
        </fieldset>

        <div class="actions">
          <button id="submit" type="submit" disabled>Submit</button>
          <button id="retry" type="button" hidden>Retry</button>
        </div>
      </form>

      <section id="results" hidden aria-live="polite">
        <h2 id="score"></h2>
        <div id="wrong-answers"></div>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("quiz-form");
    const progress = document.getElementById("progress");
    const submitButton = document.getElementById("submit");
    const retryButton = document.getElementById("retry");
    const results = document.getElementById("results");
    const score = document.getElementById("score");
    const wrongAnswers = document.getElementById("wrong-answers");
    const questions = Array.from(form.querySelectorAll("fieldset"));

    function updateProgress() {
      const answered = questions.filter(question =>
        question.querySelector("input:checked")
      ).length;

      progress.textContent = answered + " of " + questions.length + " answered";
      submitButton.disabled = answered !== questions.length;
    }

    form.addEventListener("change", updateProgress);

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      let totalCorrect = 0;
      wrongAnswers.innerHTML = "";

      questions.forEach(function (question) {
        const selected = question.querySelector("input:checked");
        const correctIndex = Number(question.dataset.correct);
        const correctInput = question.querySelectorAll("input")[correctIndex];

        if (Number(selected.value) === correctIndex) {
          totalCorrect++;
        } else {
          const item = document.createElement("article");
          item.className = "wrong-answer";

          const questionText = document.createElement("p");
          questionText.innerHTML = "<strong>Question:</strong> " +
            question.querySelector("legend").textContent;

          const chosenText = document.createElement("p");
          chosenText.innerHTML = "<strong>Your answer:</strong> " +
            selected.closest("label").textContent.trim();

          const correctText = document.createElement("p");
          correctText.innerHTML = "<strong>Correct answer:</strong> " +
            correctInput.closest("label").textContent.trim();

          item.append(questionText, chosenText, correctText);
          wrongAnswers.appendChild(item);
        }
      });

      score.textContent = "You scored " + totalCorrect + "/" + questions.length;
      results.hidden = false;
      retryButton.hidden = false;
      results.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    retryButton.addEventListener("click", function () {
      form.reset();
      updateProgress();
      results.hidden = true;
      retryButton.hidden = true;
      wrongAnswers.innerHTML = "";
      score.textContent = "";
      form.querySelector("input")?.focus();
    });

    updateProgress();
  </script>
</body>
</html>
