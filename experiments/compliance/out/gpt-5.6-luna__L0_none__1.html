<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>
  <style>
    :root {
      --color-page: #f4f7fb;
      --color-surface: #ffffff;
      --color-text: #1f2937;
      --color-muted: #64748b;
      --color-border: #dbe3ee;
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-text: #ffffff;
      --color-header: #eef3f9;
      --color-row-hover: #f8fbff;
      --color-success: #15803d;
      --color-inactive: #b45309;
      --color-focus: #93c5fd;
      --color-shadow: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--color-page);
      color: var(--color-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      box-shadow: 0 8px 24px var(--color-shadow);
      overflow: hidden;
    }

    .header {
      padding: 1.5rem 1.5rem 1rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }

    .subtitle {
      margin: 0;
      color: var(--color-muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .search-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #app-search {
      flex: 1 1 260px;
      min-width: 220px;
      padding: 0.65rem 0.8rem;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.4rem;
      font: inherit;
    }

    #app-search:focus {
      outline: 3px solid var(--color-focus);
      outline-offset: 1px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .checkbox-wrap input {
      width: 1rem;
      height: 1rem;
      accent-color: var(--color-primary);
    }

    button {
      border: 0;
      border-radius: 0.4rem;
      padding: 0.65rem 0.9rem;
      color: var(--color-primary-text);
      background: var(--color-primary);
      font: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--color-primary-hover);
    }

    button:focus-visible,
    th:focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th,
    td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
    }

    th {
      color: var(--color-text);
      background: var(--color-header);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: var(--color-row-hover);
    }

    th .sort-indicator {
      display: inline-block;
      min-width: 1rem;
      margin-left: 0.25rem;
      color: var(--color-primary);
    }

    tbody tr:hover {
      background: var(--color-row-hover);
    }

    .status {
      font-weight: 600;
    }

    .status.active {
      color: var(--color-success);
    }

    .status.inactive {
      color: var(--color-inactive);
    }

    .empty {
      padding: 2rem 1rem;
      color: var(--color-muted);
      text-align: center;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 1.5rem 1.25rem;
    }

    .summary {
      color: var(--color-muted);
      font-size: 0.95rem;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .page-label {
      min-width: 6.5rem;
      color: var(--color-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card" aria-labelledby="app-title">
      <header class="header">
        <h1 id="app-title">Employee Directory</h1>
        <p class="subtitle">Browse, filter, and export employee records.</p>
      </header>

      <div class="controls">
        <label class="search-label" for="app-search">Search by name or department</label>
        <input id="app-search" data-testid="search-input" type="search" placeholder="Search by name or department" autocomplete="off">
        <label class="checkbox-wrap" for="app-active-only">
          <input id="app-active-only" data-testid="active-only-checkbox" type="checkbox">
          <span>Active only</span>
        </label>
        <button id="app-export" data-testid="export-csv-button" type="button">Export CSV</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-testid="sort-name" data-column="name" tabindex="0" scope="col">Name <span class="sort-indicator" aria-hidden="true"></span></th>
              <th data-testid="sort-department" data-column="department" tabindex="0" scope="col">Department <span class="sort-indicator" aria-hidden="true"></span></th>
              <th data-testid="sort-salary" data-column="salary" tabindex="0" scope="col">Salary <span class="sort-indicator" aria-hidden="true"></span></th>
              <th data-testid="sort-start-date" data-column="startDate" tabindex="0" scope="col">Start date <span class="sort-indicator" aria-hidden="true"></span></th>
              <th data-testid="sort-active" data-column="active" tabindex="0" scope="col">Status <span class="sort-indicator" aria-hidden="true"></span></th>
            </tr>
          </thead>
          <tbody id="app-table-body"></tbody>
        </table>
      </div>

      <div class="footer">
        <div id="app-summary" class="summary" aria-live="polite">Showing 0-0 of 0</div>
        <nav class="pagination" aria-label="Table pagination">
          <button id="app-previous" data-testid="previous-page-button" type="button">Previous</button>
          <span id="app-page-label" class="page-label" aria-live="polite">Page 1 of 1</span>
          <button id="app-next" data-testid="next-page-button" type="button">Next</button>
        </nav>
      </div>
    </section>
  </main>

  <script>
    const employees = [
      { name: "Avery Morgan", department: "Engineering", salary: 118000, startDate: "2020-02-17", active: true },
      { name: "Bianca Rivera", department: "Sales", salary: 92000, startDate: "2021-06-07", active: true },
      { name: "Caleb Foster", department: "Support", salary: 76000, startDate: "2019-10-21", active: false },
      { name: "Dana Whitaker", department: "Design", salary: 101000, startDate: "2022-01-10", active: true },
      { name: "Elliot Chen", department: "Engineering", salary: 132000, startDate: "2018-04-23", active: true },
      { name: "Fatima Hassan", department: "Sales", salary: 88000, startDate: "2023-03-13", active: true },
      { name: "Gavin Brooks", department: "Support", salary: 71000, startDate: "2020-08-03", active: true },
      { name: "Harper Singh", department: "Design", salary: 97000, startDate: "2021-11-15", active: false },
      { name: "Iris Bennett", department: "Engineering", salary: 125000, startDate: "2017-09-18", active: true },
      { name: "Jonah Ellis", department: "Sales", salary: 105000, startDate: "2019-01-28", active: true },
      { name: "Kiara Patel", department: "Support", salary: 79000, startDate: "2022-07-11", active: true },
      { name: "Liam Carter", department: "Design", salary: 89000, startDate: "2020-12-01", active: true },
      { name: "Maya Thompson", department: "Engineering", salary: 141000, startDate: "2016-05-16", active: false },
      { name: "Noah Williams", department: "Sales", salary: 99000, startDate: "2022-09-06", active: true },
      { name: "Olivia Park", department: "Support", salary: 73500, startDate: "2023-01-23", active: true },
      { name: "Peter Lawson", department: "Design", salary: 108000, startDate: "2018-11-12", active: true },
      { name: "Quinn Ramirez", department: "Engineering", salary: 113000, startDate: "2021-02-08", active: true },
      { name: "Riley Kim", department: "Sales", salary: 94000, startDate: "2020-06-29", active: false },
      { name: "Sofia Martinez", department: "Support", salary: 82500, startDate: "2019-07-15", active: true },
      { name: "Theo Adams", department: "Design", salary: 93000, startDate: "2022-04-18", active: true },
      { name: "Uma Desai", department: "Engineering", salary: 129000, startDate: "2018-08-27", active: true },
      { name: "Victor Stone", department: "Sales", salary: 111000, startDate: "2017-12-04", active: false },
      { name: "Wren Hughes", department: "Support", salary: 77000, startDate: "2021-08-16", active: true },
      { name: "Yara Okafor", department: "Design", salary: 116000, startDate: "2019-03-25", active: true }
    ];

    const rowsPerPage = 10;
    let currentPage = 1;
    let sortColumn = "name";
    let sortDirection = "ascending";

    const searchInput = document.getElementById("app-search");
    const activeOnlyInput = document.getElementById("app-active-only");
    const exportButton = document.getElementById("app-export");
    const tableBody = document.getElementById("app-table-body");
    const summary = document.getElementById("app-summary");
    const previousButton = document.getElementById("app-previous");
    const nextButton = document.getElementById("app-next");
    const pageLabel = document.getElementById("app-page-label");
    const headers = document.querySelectorAll("th[data-column]");

    function getFilteredEmployees() {
      const query = searchInput.value.trim().toLowerCase();
      return employees.filter((employee) => {
        const matchesText = employee.name.toLowerCase().includes(query) || employee.department.toLowerCase().includes(query);
        const matchesActive = !activeOnlyInput.checked || employee.active;
        return matchesText && matchesActive;
      });
    }

    function getSortedEmployees(records) {
      return [...records].sort((first, second) => {
        const firstValue = first[sortColumn];
        const secondValue = second[sortColumn];
        let comparison = 0;
        if (typeof firstValue === "string") {
          comparison = firstValue.localeCompare(secondValue);
        } else if (typeof firstValue === "boolean") {
          comparison = Number(firstValue) - Number(secondValue);
        } else {
          comparison = firstValue - secondValue;
        }
        return sortDirection === "ascending" ? comparison : -comparison;
      });
    }

    function formatSalary(salary) {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(salary);
    }

    function addCell(row, value, className) {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) {
        cell.className = className;
      }
      row.appendChild(cell);
    }

    function renderTable() {
      const sortedEmployees = getSortedEmployees(getFilteredEmployees());
      const totalPages = Math.max(1, Math.ceil(sortedEmployees.length / rowsPerPage));
      currentPage = Math.min(currentPage, totalPages);
      const firstIndex = (currentPage - 1) * rowsPerPage;
      const pageEmployees = sortedEmployees.slice(firstIndex, firstIndex + rowsPerPage);

      tableBody.replaceChildren();
      if (pageEmployees.length === 0) {
        const emptyRow = document.createElement("tr");
        const emptyCell = document.createElement("td");
        emptyCell.className = "empty";
        emptyCell.colSpan = 5;
        emptyCell.textContent = "No employees match the current filters.";
        emptyRow.appendChild(emptyCell);
        tableBody.appendChild(emptyRow);
      } else {
        pageEmployees.forEach((employee) => {
          const row = document.createElement("tr");
          addCell(row, employee.name);
          addCell(row, employee.department);
          addCell(row, formatSalary(employee.salary));
          addCell(row, employee.startDate);
          addCell(row, employee.active ? "Active" : "Inactive", employee.active ? "status active" : "status inactive");
          tableBody.appendChild(row);
        });
      }

      const shownStart = sortedEmployees.length === 0 ? 0 : firstIndex + 1;
      const shownEnd = Math.min(firstIndex + rowsPerPage, sortedEmployees.length);
      summary.textContent = `Showing ${shownStart}-${shownEnd} of ${sortedEmployees.length}`;
      pageLabel.textContent = `Page ${currentPage} of ${totalPages}`;
      previousButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;

      headers.forEach((header) => {
        const indicator = header.querySelector(".sort-indicator");
        const isCurrent = header.dataset.column === sortColumn;
        indicator.textContent = isCurrent ? (sortDirection === "ascending" ? "↑" : "↓") : "";
        header.setAttribute("aria-sort", isCurrent ? sortDirection : "none");
      });
    }

    function sortByColumn(column) {
      if (sortColumn === column) {
        sortDirection = sortDirection === "ascending" ? "descending" : "ascending";
      } else {
        sortColumn = column;
        sortDirection = "ascending";
      }
      currentPage = 1;
      renderTable();
    }

    function exportCsv() {
      const records = getSortedEmployees(getFilteredEmployees());
      const headersForCsv = ["Name", "Department", "Salary", "Start Date", "Active"];
      const csvRows = [headersForCsv, ...records.map((employee) => [employee.name, employee.department, employee.salary, employee.startDate, employee.active ? "Yes" : "No"])]
        .map((row) => row.map((value) => `"${String(value).replaceAll('"', '""')}"`).join(","));
      const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.dataset.testid = "csv-download-link";
      link.href = url;
      link.download = "filtered-employees.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    searchInput.addEventListener("input", () => {
      currentPage = 1;
      renderTable();
    });

    activeOnlyInput.addEventListener("change", () => {
      currentPage = 1;
      renderTable();
    });

    exportButton.addEventListener("click", exportCsv);
    previousButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderTable();
      }
    });
    nextButton.addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(getFilteredEmployees().length / rowsPerPage));
      if (currentPage < totalPages) {
        currentPage += 1;
        renderTable();
      }
    });

    headers.forEach((header) => {
      header.addEventListener("click", () => sortByColumn(header.dataset.column));
      header.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          sortByColumn(header.dataset.column);
        }
      });
    });

    renderTable();
  </script>
</body>
</html>
