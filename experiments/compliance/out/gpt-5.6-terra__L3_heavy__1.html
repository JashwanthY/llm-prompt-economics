<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>
  <style>
    :root {
      --color-page: hsl(210 33% 98%);
      --color-surface: hsl(0 0% 100%);
      --color-text: hsl(215 28% 17%);
      --color-muted: hsl(215 16% 39%);
      --color-border: hsl(214 22% 85%);
      --color-primary: hsl(218 76% 37%);
      --color-primary-hover: hsl(218 76% 29%);
      --color-primary-text: hsl(0 0% 100%);
      --color-focus: hsl(35 92% 45%);
      --color-header: hsl(215 35% 18%);
      --color-header-text: hsl(0 0% 100%);
      --color-row-hover: hsl(210 40% 96%);
      --color-status-active: hsl(145 58% 29%);
      --color-status-inactive: hsl(0 55% 38%);
      --shadow-surface: 0 0.5rem 1.5rem hsl(215 28% 17% / 0.1);
      --radius: 0.5rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 20rem;
      margin: 0;
      background: var(--color-page);
      color: var(--color-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 0.1875rem solid var(--color-focus);
      outline-offset: 0.1875rem;
    }

    .app-shell {
      width: min(100% - 2rem, 75rem);
      margin: 0 auto;
      padding: var(--space-6) 0;
    }

    .app-header {
      margin-bottom: var(--space-5);
    }

    .app-title {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    .app-intro {
      max-width: 45rem;
      margin: var(--space-2) 0 0;
      color: var(--color-muted);
    }

    .employee-directory {
      padding: var(--space-5);
      background: var(--color-surface);
      border: 0.0625rem solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-surface);
    }

    .directory-title {
      margin: 0 0 var(--space-4);
      font-size: 1.25rem;
    }

    .directory-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: var(--space-4);
      align-items: end;
      margin-bottom: var(--space-4);
    }

    .control-group {
      display: grid;
      gap: var(--space-2);
    }

    .control-label {
      font-weight: 700;
    }

    .text-input {
      width: 100%;
      min-height: 2.75rem;
      padding: var(--space-2) var(--space-3);
      color: var(--color-text);
      background: var(--color-surface);
      border: 0.0625rem solid var(--color-muted);
      border-radius: var(--radius);
    }

    .checkbox-group {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      min-height: 2.75rem;
    }

    .checkbox-input {
      width: 1.125rem;
      height: 1.125rem;
      accent-color: var(--color-primary);
    }

    .button {
      min-height: 2.75rem;
      padding: var(--space-2) var(--space-4);
      border: 0.0625rem solid var(--color-primary);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
    }

    .button--primary {
      background: var(--color-primary);
      color: var(--color-primary-text);
    }

    .button--primary:hover {
      background: var(--color-primary-hover);
    }

    .button--secondary {
      background: var(--color-surface);
      color: var(--color-primary);
    }

    .button--secondary:hover:not(:disabled) {
      background: var(--color-row-hover);
    }

    .button:disabled {
      border-color: var(--color-border);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .directory-summary {
      margin: 0 0 var(--space-3);
      color: var(--color-muted);
      font-weight: 700;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 0.0625rem solid var(--color-border);
      border-radius: var(--radius);
    }

    .employee-table {
      width: 100%;
      min-width: 44rem;
      border-collapse: collapse;
    }

    .employee-table th,
    .employee-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 0.0625rem solid var(--color-border);
      text-align: left;
      white-space: nowrap;
    }

    .employee-table th {
      background: var(--color-header);
      color: var(--color-header-text);
    }

    .employee-table tr:last-child td {
      border-bottom: 0;
    }

    .employee-table tbody tr:hover {
      background: var(--color-row-hover);
    }

    .sort-button {
      display: inline-flex;
      gap: var(--space-2);
      align-items: center;
      width: 100%;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-align: left;
    }

    .sort-indicator {
      min-width: 1.2rem;
    }

    .status {
      font-weight: 700;
    }

    .status--active {
      color: var(--color-status-active);
    }

    .status--inactive {
      color: var(--color-status-inactive);
    }

    .empty-state {
      padding: var(--space-6);
      color: var(--color-muted);
      text-align: center;
    }

    .directory-footer {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-4);
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
    }

    .page-status {
      min-width: 7rem;
      color: var(--color-muted);
      text-align: center;
    }

    .app-footer {
      margin-top: var(--space-5);
      color: var(--color-muted);
      font-size: 0.875rem;
    }

    .visually-hidden {
      position: absolute;
      width: 0.0625rem;
      height: 0.0625rem;
      padding: 0;
      margin: -0.0625rem;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 42rem) {
      .app-shell {
        width: min(100% - 1rem, 75rem);
        padding: var(--space-4) 0;
      }

      .employee-directory {
        padding: var(--space-4);
      }

      .directory-controls {
        grid-template-columns: 1fr;
        gap: var(--space-3);
      }

      .directory-footer {
        align-items: stretch;
      }

      .pagination {
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .button,
      .text-input {
        transition: background-color 150ms ease, border-color 150ms ease;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Employee Directory</h1>
      <p class="app-intro">Search, sort, and export employee information.</p>
    </header>

    <section class="employee-directory" aria-labelledby="app-directory-title">
      <h2 id="app-directory-title" class="directory-title">Directory records</h2>

      <section class="directory-controls" aria-label="Directory filters">
        <p class="control-group">
          <label class="control-label" for="app-search">Search employees</label>
          <input id="app-search" class="text-input" type="search" data-testid="employee-search" placeholder="Name or department" autocomplete="off">
        </p>
        <p class="checkbox-group">
          <input id="app-active-only" class="checkbox-input" type="checkbox" data-testid="active-only-filter">
          <label for="app-active-only">Active only</label>
        </p>
        <button id="app-export" class="button button--primary" type="button" data-testid="export-csv">Export CSV</button>
      </section>

      <p id="app-summary" class="directory-summary" aria-live="polite" data-testid="results-summary">Showing 1-10 of 24</p>

      <section class="table-wrapper" aria-label="Employee records table">
        <table class="employee-table">
          <thead>
            <tr>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-key="name" data-testid="sort-name">Name <span class="sort-indicator" aria-hidden="true">↕</span><span class="visually-hidden">Sort by name</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-key="department" data-testid="sort-department">Department <span class="sort-indicator" aria-hidden="true">↕</span><span class="visually-hidden">Sort by department</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-key="salary" data-testid="sort-salary">Salary <span class="sort-indicator" aria-hidden="true">↕</span><span class="visually-hidden">Sort by salary</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-key="startDate" data-testid="sort-start-date">Start date <span class="sort-indicator" aria-hidden="true">↕</span><span class="visually-hidden">Sort by start date</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-key="active" data-testid="sort-active">Status <span class="sort-indicator" aria-hidden="true">↕</span><span class="visually-hidden">Sort by status</span></button></th>
            </tr>
          </thead>
          <tbody id="app-table-body"></tbody>
        </table>
      </section>

      <footer class="directory-footer">
        <nav class="pagination" aria-label="Employee table pagination">
          <button id="app-previous" class="button button--secondary" type="button" data-testid="previous-page" aria-label="Go to previous page">Previous</button>
          <span id="app-page-status" class="page-status" aria-live="polite" data-testid="page-status">Page 1 of 3</span>
          <button id="app-next" class="button button--secondary" type="button" data-testid="next-page" aria-label="Go to next page">Next</button>
        </nav>
      </footer>
    </section>

    <footer class="app-footer">Employee data is for demonstration purposes only.</footer>
  </main>

  <script>
    (() => {
      'use strict';

      const PAGE_SIZE = 10;
      const SEARCH_DEBOUNCE_MS = 150;
      const employees = [
        { name: 'Amelia Brooks', department: 'Design', salary: 88500, startDate: '2021-04-12', active: true },
        { name: 'Marcus Chen', department: 'Engineering', salary: 128000, startDate: '2019-09-23', active: true },
        { name: 'Priya Desai', department: 'Support', salary: 70200, startDate: '2022-01-17', active: true },
        { name: 'Ethan Foster', department: 'Sales', salary: 96500, startDate: '2020-06-08', active: false },
        { name: 'Sofia Garcia', department: 'Engineering', salary: 116000, startDate: '2018-11-05', active: true },
        { name: 'Noah Hamilton', department: 'Sales', salary: 104000, startDate: '2023-03-21', active: true },
        { name: 'Isabella Ivanov', department: 'Design', salary: 92100, startDate: '2020-08-14', active: false },
        { name: 'Liam Johnson', department: 'Support', salary: 68400, startDate: '2021-10-01', active: true },
        { name: 'Olivia Kim', department: 'Engineering', salary: 135000, startDate: '2017-05-19', active: true },
        { name: 'Benjamin Lee', department: 'Sales', salary: 98500, startDate: '2022-07-11', active: true },
        { name: 'Harper Martinez', department: 'Support', salary: 74800, startDate: '2019-02-25', active: false },
        { name: 'Elijah Nguyen', department: 'Engineering', salary: 110500, startDate: '2021-12-06', active: true },
        { name: 'Mia O’Connor', department: 'Design', salary: 86700, startDate: '2023-09-18', active: true },
        { name: 'James Patel', department: 'Sales', salary: 101200, startDate: '2018-03-29', active: false },
        { name: 'Charlotte Quinn', department: 'Support', salary: 72600, startDate: '2020-10-26', active: true },
        { name: 'William Rodriguez', department: 'Engineering', salary: 122400, startDate: '2019-07-15', active: true },
        { name: 'Evelyn Singh', department: 'Design', salary: 94600, startDate: '2022-04-04', active: true },
        { name: 'Henry Thompson', department: 'Sales', salary: 93800, startDate: '2021-01-30', active: true },
        { name: 'Abigail Usman', department: 'Support', salary: 71500, startDate: '2018-08-20', active: false },
        { name: 'Alexander Vasquez', department: 'Engineering', salary: 119800, startDate: '2020-02-11', active: true },
        { name: 'Ella Wilson', department: 'Design', salary: 90300, startDate: '2019-12-09', active: true },
        { name: 'Daniel Xu', department: 'Sales', salary: 107500, startDate: '2023-06-27', active: true },
        { name: 'Grace Young', department: 'Support', salary: 76900, startDate: '2021-05-03', active: true },
        { name: 'Michael Zaman', department: 'Engineering', salary: 132600, startDate: '2017-10-16', active: false }
      ];

      const state = {
        searchTerm: '',
        activeOnly: false,
        sortKey: 'name',
        sortDirection: 'ascending',
        currentPage: 1
      };

      const elements = {
        search: document.getElementById('app-search'),
        activeOnly: document.getElementById('app-active-only'),
        exportButton: document.getElementById('app-export'),
        tableBody: document.getElementById('app-table-body'),
        summary: document.getElementById('app-summary'),
        previousButton: document.getElementById('app-previous'),
        nextButton: document.getElementById('app-next'),
        pageStatus: document.getElementById('app-page-status'),
        sortButtons: Array.from(document.querySelectorAll('.sort-button'))
      };

      const currencyFormatter = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      });
      const dateFormatter = new Intl.DateTimeFormat('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        timeZone: 'UTC'
      });

      const formatDate = (isoDate) => dateFormatter.format(new Date(`${isoDate}T00:00:00Z`));

      const getFilteredEmployees = () => {
        const normalizedSearch = state.searchTerm.trim().toLocaleLowerCase();
        return employees.filter((employee) => {
          const matchesSearch = !normalizedSearch || [employee.name, employee.department]
            .some((value) => value.toLocaleLowerCase().includes(normalizedSearch));
          return matchesSearch && (!state.activeOnly || employee.active);
        });
      };

      const compareEmployees = (firstEmployee, secondEmployee) => {
        const firstValue = firstEmployee[state.sortKey];
        const secondValue = secondEmployee[state.sortKey];
        let comparison;

        if (typeof firstValue === 'string') {
          comparison = firstValue.localeCompare(secondValue);
        } else if (typeof firstValue === 'boolean') {
          comparison = Number(firstValue) - Number(secondValue);
        } else {
          comparison = firstValue - secondValue;
        }

        return state.sortDirection === 'ascending' ? comparison : -comparison;
      };

      const getSortedEmployees = (filteredEmployees) => [...filteredEmployees].sort(compareEmployees);

      const createCell = (value, className = '') => {
        const cell = document.createElement('td');
        cell.textContent = value;
        if (className) {
          cell.className = className;
        }
        return cell;
      };

      const renderTable = (pageEmployees) => {
        const fragment = document.createDocumentFragment();

        if (pageEmployees.length === 0) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 5;
          cell.className = 'empty-state';
          cell.textContent = 'No employees match the current filters.';
          row.append(cell);
          fragment.append(row);
        } else {
          pageEmployees.forEach((employee) => {
            const row = document.createElement('tr');
            row.append(
              createCell(employee.name),
              createCell(employee.department),
              createCell(currencyFormatter.format(employee.salary)),
              createCell(formatDate(employee.startDate)),
              createCell(employee.active ? 'Active' : 'Inactive', employee.active ? 'status status--active' : 'status status--inactive')
            );
            fragment.append(row);
          });
        }

        elements.tableBody.replaceChildren(fragment);
      };

      const updateSortControls = () => {
        elements.sortButtons.forEach((button) => {
          const header = button.closest('th');
          const indicator = button.querySelector('.sort-indicator');
          const isCurrentSort = button.dataset.sortKey === state.sortKey;
          const directionText = state.sortDirection === 'ascending' ? 'ascending' : 'descending';

          indicator.textContent = isCurrentSort ? (state.sortDirection === 'ascending' ? '↑' : '↓') : '↕';
          button.setAttribute('aria-label', isCurrentSort
            ? `Sort by ${button.dataset.sortKey}, currently ${directionText}`
            : `Sort by ${button.dataset.sortKey}`);
          header.setAttribute('aria-sort', isCurrentSort ? state.sortDirection : 'none');
        });
      };

      const render = () => {
        const filteredEmployees = getFilteredEmployees();
        const sortedEmployees = getSortedEmployees(filteredEmployees);
        const pageCount = Math.max(1, Math.ceil(sortedEmployees.length / PAGE_SIZE));
        state.currentPage = Math.min(state.currentPage, pageCount);

        const startIndex = (state.currentPage - 1) * PAGE_SIZE;
        const pageEmployees = sortedEmployees.slice(startIndex, startIndex + PAGE_SIZE);
        const showingStart = sortedEmployees.length === 0 ? 0 : startIndex + 1;
        const showingEnd = startIndex + pageEmployees.length;

        renderTable(pageEmployees);
        elements.summary.textContent = `Showing ${showingStart}-${showingEnd} of ${sortedEmployees.length}`;
        elements.pageStatus.textContent = `Page ${state.currentPage} of ${pageCount}`;
        elements.previousButton.disabled = state.currentPage === 1;
        elements.previousButton.title = state.currentPage === 1 ? 'You are already on the first page.' : '';
        elements.nextButton.disabled = state.currentPage === pageCount;
        elements.nextButton.title = state.currentPage === pageCount ? 'You are already on the last page.' : '';
        updateSortControls();
      };

      const escapeCsvValue = (value) => `"${String(value).replaceAll('"', '""')}"`;

      const exportCsv = () => {
        const filteredEmployees = getSortedEmployees(getFilteredEmployees());
        const columns = ['Name', 'Department', 'Salary', 'Start Date', 'Active'];
        const records = filteredEmployees.map((employee) => [
          employee.name,
          employee.department,
          employee.salary,
          employee.startDate,
          employee.active ? 'Active' : 'Inactive'
        ]);
        const csvContent = [columns, ...records]
          .map((record) => record.map(escapeCsvValue).join(','))
          .join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(blob);
        const downloadLink = document.createElement('a');
        downloadLink.href = downloadUrl;
        downloadLink.download = 'employees-filtered.csv';
        downloadLink.dataset.testid = 'csv-download-link';
        document.body.append(downloadLink);
        downloadLink.click();
        downloadLink.remove();
        URL.revokeObjectURL(downloadUrl);
      };

      let searchTimer;
      elements.search.addEventListener('input', (event) => {
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(() => {
          state.searchTerm = event.target.value;
          state.currentPage = 1;
          render();
        }, SEARCH_DEBOUNCE_MS);
      });

      elements.activeOnly.addEventListener('change', (event) => {
        state.activeOnly = event.target.checked;
        state.currentPage = 1;
        render();
      });

      elements.sortButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const selectedKey = button.dataset.sortKey;
          state.sortDirection = state.sortKey === selectedKey && state.sortDirection === 'ascending'
            ? 'descending'
            : 'ascending';
          state.sortKey = selectedKey;
          state.currentPage = 1;
          render();
        });
      });

      elements.previousButton.addEventListener('click', () => {
        if (state.currentPage > 1) {
          state.currentPage -= 1;
          render();
        }
      });

      elements.nextButton.addEventListener('click', () => {
        const filteredCount = getFilteredEmployees().length;
        const pageCount = Math.max(1, Math.ceil(filteredCount / PAGE_SIZE));
        if (state.currentPage < pageCount) {
          state.currentPage += 1;
          render();
        }
      });

      elements.exportButton.addEventListener('click', exportCsv);
      render();
    })();
  </script>
</body>
</html>
