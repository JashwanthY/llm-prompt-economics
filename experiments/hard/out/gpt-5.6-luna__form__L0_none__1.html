<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #18212b; }
    form { width: min(92vw, 30rem); box-sizing: border-box; padding: 2rem; background: #fff; border: 1px solid #d9e0e7; border-radius: 12px; box-shadow: 0 8px 24px rgba(24, 33, 43, .08); }
    h1 { margin: 0 0 1.5rem; font-size: 1.6rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: .65rem .75rem; border: 1px solid #aeb9c5; border-radius: 6px; font: inherit; }
    input:focus { outline: 2px solid #6aa6e8; outline-offset: 1px; }
    .error { display: block; min-height: 1.25rem; margin-top: .25rem; color: #b42318; font-size: .875rem; }
    button { width: 100%; padding: .7rem 1rem; border: 0; border-radius: 6px; background: #1769aa; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #aeb9c5; cursor: not-allowed; }
  </style>
</head>
<body>
  <form id="registration-form" novalidate>
    <h1>Create an account</h1>

    <div class="field">
      <label for="app-username">Username</label>
      <input id="app-username" name="username" type="text" autocomplete="username" aria-describedby="err-username">
      <span id="err-username" class="error" role="alert"></span>
    </div>

    <div class="field">
      <label for="app-email">Email</label>
      <input id="app-email" name="email" type="email" autocomplete="email" aria-describedby="err-email">
      <span id="err-email" class="error" role="alert"></span>
    </div>

    <div class="field">
      <label for="app-password">Password</label>
      <input id="app-password" name="password" type="password" autocomplete="new-password" aria-describedby="err-password">
      <span id="err-password" class="error" role="alert"></span>
    </div>

    <div class="field">
      <label for="app-confirm">Confirm password</label>
      <input id="app-confirm" name="confirm" type="password" autocomplete="new-password" aria-describedby="err-confirm">
      <span id="err-confirm" class="error" role="alert"></span>
    </div>

    <div class="field">
      <label for="app-dob">Date of birth</label>
      <input id="app-dob" name="dob" type="date" autocomplete="bday" aria-describedby="err-dob">
      <span id="err-dob" class="error" role="alert"></span>
    </div>

    <div class="field">
      <label for="app-phone">Phone</label>
      <input id="app-phone" name="phone" type="tel" autocomplete="tel" aria-describedby="err-phone">
      <span id="err-phone" class="error" role="alert"></span>
    </div>

    <button id="app-submit" type="submit" disabled>Register</button>
  </form>

  <script>
    (function () {
      'use strict';

      const fields = {
        username: document.getElementById('app-username'),
        email: document.getElementById('app-email'),
        password: document.getElementById('app-password'),
        confirm: document.getElementById('app-confirm'),
        dob: document.getElementById('app-dob'),
        phone: document.getElementById('app-phone')
      };
      const errors = {
        username: document.getElementById('err-username'),
        email: document.getElementById('err-email'),
        password: document.getElementById('err-password'),
        confirm: document.getElementById('err-confirm'),
        dob: document.getElementById('err-dob'),
        phone: document.getElementById('err-phone')
      };
      const submit = document.getElementById('app-submit');
      const taken = new Set(['admin', 'root', 'test']);

      function usernameError(value) {
        if (value === '') return 'Username is required';
        if (value.length < 3 || value.length > 16) return 'Username must be 3-16 characters';
        if (!/^[A-Za-z0-9_]+$/.test(value)) return 'Username may only contain letters, digits and underscore';
        if (taken.has(value)) return 'Username is already taken';
        return '';
      }

      function emailError(value) {
        const atCount = (value.match(/@/g) || []).length;
        if (atCount !== 1) return 'Enter a valid email address';
        const parts = value.split('@');
        if (parts[0] === '' || parts[1] === '' || !parts[1].includes('.')) {
          return 'Enter a valid email address';
        }
        return '';
      }

      function passwordError(value) {
        if (value.length < 10) return 'Password must be at least 10 characters';
        const missing = [];
        if (!/[A-Z]/.test(value)) missing.push('uppercase');
        if (!/[a-z]/.test(value)) missing.push('lowercase');
        if (!/[0-9]/.test(value)) missing.push('digit');
        if (!/[^A-Za-z0-9]/.test(value)) missing.push('symbol');
        return missing.length ? 'Password needs: ' + missing.join(', ') : '';
      }

      function dobError(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return 'You must be at least 18';
        const parts = value.split('-').map(Number);
        const birth = new Date(parts[0], parts[1] - 1, parts[2]);
        if (birth.getFullYear() !== parts[0] || birth.getMonth() !== parts[1] - 1 || birth.getDate() !== parts[2]) {
          return 'You must be at least 18';
        }
        const today = new Date();
        const eighteenthBirthday = new Date(parts[0] + 18, parts[1] - 1, parts[2]);
        return eighteenthBirthday > today ? 'You must be at least 18' : '';
      }

      function phoneError(value) {
        if (!/^[0-9\s()\-]+$/.test(value)) return 'Enter a 10-digit phone number';
        const digits = value.replace(/[\s()\-]/g, '');
        return /^\d{10}$/.test(digits) ? '' : 'Enter a 10-digit phone number';
      }

      function validate() {
        const messages = {
          username: usernameError(fields.username.value),
          email: emailError(fields.email.value),
          password: passwordError(fields.password.value),
          confirm: fields.confirm.value === fields.password.value ? '' : 'Passwords do not match',
          dob: dobError(fields.dob.value),
          phone: phoneError(fields.phone.value)
        };
        let valid = true;
        Object.keys(messages).forEach(function (key) {
          errors[key].textContent = messages[key];
          fields[key].setAttribute('aria-invalid', messages[key] ? 'true' : 'false');
          if (messages[key]) valid = false;
        });
        submit.disabled = !valid;
        return valid;
      }

      Object.keys(fields).forEach(function (key) {
        fields[key].addEventListener('input', validate);
        fields[key].addEventListener('change', validate);
      });

      document.getElementById('registration-form').addEventListener('submit', function (event) {
        if (!validate()) event.preventDefault();
        else event.preventDefault();
      });

      validate();
    }());
  </script>
</body>
</html>
