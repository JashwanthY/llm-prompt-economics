<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #1f2933; }
    form { width: min(100% - 2rem,  thirtyrem); max-width: 30rem; box-sizing: border-box; padding: 2rem; background: #fff; border: 1px solid #d9e0e7; border-radius: .6rem; box-shadow: 0 .3rem 1rem rgba(0,0,0,.06); }
    h1 { margin: 0 0 1.5rem; font-size: 1.6rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: .65rem .7rem; border: 1px solid #aeb8c2; border-radius: .3rem; font: inherit; }
    input:focus { outline: 2px solid #8ab4f8; outline-offset: 1px; }
    .error { display: block; min-height: 1.2em; margin-top: .3rem; color: #b42318; font-size: .875rem; }
    button { width: 100%; padding: .7rem; border: 0; border-radius: .3rem; background: #1769aa; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #aab4bf; cursor: not-allowed; }
  </style>
</head>
<body>
  <form id="registration-form" novalidate>
    <h1>Create an account</h1>

    <div class="field">
      <label for="app-username">Username</label>
      <input id="app-username" name="username" type="text" autocomplete="username">
      <span id="err-username" class="error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="app-email">Email</label>
      <input id="app-email" name="email" type="email" autocomplete="email">
      <span id="err-email" class="error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="app-password">Password</label>
      <input id="app-password" name="password" type="password" autocomplete="new-password">
      <span id="err-password" class="error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="app-confirm">Confirm password</label>
      <input id="app-confirm" name="confirm" type="password" autocomplete="new-password">
      <span id="err-confirm" class="error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="app-dob">Date of birth</label>
      <input id="app-dob" name="dob" type="date">
      <span id="err-dob" class="error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="app-phone">Phone</label>
      <input id="app-phone" name="phone" type="tel" autocomplete="tel">
      <span id="err-phone" class="error" aria-live="polite"></span>
    </div>

    <button id="app-submit" type="submit" disabled>Register</button>
  </form>

  <script>
    (function () {
      const fields = {
        username: document.getElementById('app-username'),
        email: document.getElementById('app-email'),
        password: document.getElementById('app-password'),
        confirm: document.getElementById('app-confirm'),
        dob: document.getElementById('app-dob'),
        phone: document.getElementById('app-phone')
      };
      const errors = {
        username: document.getElementById('err-username'),
        email: document.getElementById('err-email'),
        password: document.getElementById('err-password'),
        confirm: document.getElementById('err-confirm'),
        dob: document.getElementById('err-dob'),
        phone: document.getElementById('err-phone')
      };
      const submit = document.getElementById('app-submit');
      const taken = new Set(['admin', 'root', 'test']);

      function validateUsername(value) {
        if (value.length === 0) return 'Username is required';
        if (value.length < 3 || value.length > 16) return 'Username must be 3-16 characters';
        if (!/^[A-Za-z0-9_]+$/.test(value)) return 'Username may only contain letters, digits and underscore';
        if (taken.has(value)) return 'Username is already taken';
        return '';
      }

      function validateEmail(value) {
        const atCount = (value.match(/@/g) || []).length;
        if (atCount !== 1) return 'Enter a valid email address';
        const parts = value.split('@');
        if (!parts[0] || !parts[1] || !parts[1].includes('.')) return 'Enter a valid email address';
        return '';
      }

      function validatePassword(value) {
        if (value.length < 10) return 'Password must be at least 10 characters';
        const missing = [];
        if (!/[A-Z]/.test(value)) missing.push('uppercase');
        if (!/[a-z]/.test(value)) missing.push('lowercase');
        if (!/[0-9]/.test(value)) missing.push('digit');
        if (!/[^A-Za-z0-9]/.test(value)) missing.push('symbol');
        return missing.length ? 'Password needs: ' + missing.join(', ') : '';
      }

      function validateDob(value) {
        if (!value) return 'You must be at least 18';
        const parts = value.split('-').map(Number);
        const birth = new Date(parts[0], parts[1] - 1, parts[2]);
        if (birth.getFullYear() !== parts[0] || birth.getMonth() !== parts[1] - 1 || birth.getDate() !== parts[2]) {
          return 'You must be at least 18';
        }
        const today = new Date();
        let age = today.getFullYear() - parts[0];
        const birthdayPassed = today.getMonth() > parts[1] - 1 ||
          (today.getMonth() === parts[1] - 1 && today.getDate() >= parts[2]);
        if (!birthdayPassed) age--;
        return age >= 18 ? '' : 'You must be at least 18';
      }

      function validate() {
        const messages = {
          username: validateUsername(fields.username.value),
          email: validateEmail(fields.email.value),
          password: validatePassword(fields.password.value),
          confirm: fields.confirm.value === fields.password.value ? '' : 'Passwords do not match',
          dob: validateDob(fields.dob.value),
          phone: /^\d{10}$/.test(fields.phone.value.replace(/[ \-()]/g, '')) ? '' : 'Enter a 10-digit phone number'
        };
        let valid = true;
        Object.keys(messages).forEach(function (name) {
          errors[name].textContent = messages[name];
          fields[name].setAttribute('aria-invalid', messages[name] ? 'true' : 'false');
          if (messages[name]) valid = false;
        });
        submit.disabled = !valid;
        return valid;
      }

      Object.values(fields).forEach(function (field) {
        field.addEventListener('input', validate);
        field.addEventListener('change', validate);
      });
      document.getElementById('registration-form').addEventListener('submit', function (event) {
        if (!validate()) event.preventDefault();
      });
      validate();
    }());
  </script>
</body>
</html>
