<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Pricing Engine</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f4f6f8; color: #1f2937; }
    main { width: min(92%, 620px); margin: 3rem auto; padding: 2rem; background: #fff; border: 1px solid #d9dee5; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 1.5rem; font-size: 1.6rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
    th, td { padding: .75rem .5rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    input { box-sizing: border-box; padding: .55rem .65rem; border: 1px solid #b8c0cc; border-radius: 6px; font: inherit; }
    input[type="number"] { width: 5.5rem; }
    .coupon { display: flex; gap: .6rem; align-items: center; margin-bottom: .35rem; }
    #app-coupon { flex: 1; text-transform: uppercase; }
    button { padding: .55rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { min-height: 1.3rem; color: #b91c1c; font-size: .9rem; }
    .summary { margin-top: 1rem; border-top: 2px solid #e5e7eb; padding-top: .75rem; }
    .summary p { display: flex; justify-content: space-between; margin: .55rem 0; }
    .summary .total { margin-top: .9rem; padding-top: .75rem; border-top: 1px solid #d1d5db; font-size: 1.15rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <table>
      <thead>
        <tr><th>Item</th><th>Price</th><th>Quantity</th></tr>
      </thead>
      <tbody>
        <tr><td>Widget</td><td>$24.99</td><td><input id="qty-widget" type="number" min="0" step="1" value="0" aria-label="Widget quantity"></td></tr>
        <tr><td>Gadget</td><td>$79.50</td><td><input id="qty-gadget" type="number" min="0" step="1" value="0" aria-label="Gadget quantity"></td></tr>
        <tr><td>Doohickey</td><td>$12.25</td><td><input id="qty-doohickey" type="number" min="0" step="1" value="0" aria-label="Doohickey quantity"></td></tr>
      </tbody>
    </table>

    <div class="coupon">
      <input id="app-coupon" type="text" placeholder="Coupon code" aria-label="Coupon code">
      <button id="app-apply" type="button">Apply</button>
    </div>
    <span id="out-coupon-error" class="error" role="alert"></span>

    <section class="summary" aria-label="Order summary">
      <p><span>Subtotal</span><span id="out-subtotal">$0.00</span></p>
      <p><span>Discount</span><span id="out-discount">$0.00</span></p>
      <p><span>Shipping</span><span id="out-shipping">$8.00</span></p>
      <p><span>Tax</span><span id="out-tax">$0.00</span></p>
      <p class="total"><span>Total</span><span id="out-total">$8.00</span></p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var products = [
        { id: 'qty-widget', price: 24.99 },
        { id: 'qty-gadget', price: 79.50 },
        { id: 'qty-doohickey', price: 12.25 }
      ];
      var appliedCoupon = '';
      var couponInput = document.getElementById('app-coupon');
      var errorOutput = document.getElementById('out-coupon-error');

      function money(value) {
        return '$' + value.toFixed(2);
      }

      function getQuantity(input) {
        var value = Number(input.value);
        if (!Number.isFinite(value) || value < 0) return 0;
        return Math.floor(value);
      }

      function calculate() {
        var subtotal = 0;
        products.forEach(function (product) {
          var input = document.getElementById(product.id);
          var quantity = getQuantity(input);
          input.value = String(quantity);
          subtotal += product.price * quantity;
        });

        var volumeRate = subtotal >= 500 ? 0.15 : subtotal >= 250 ? 0.10 : subtotal >= 100 ? 0.05 : 0;
        var volumeDiscount = subtotal * volumeRate;
        var couponDiscount = 0;
        var discount = volumeDiscount;

        if (appliedCoupon === 'SAVE10') {
          couponDiscount = subtotal * 0.10;
          discount = Math.max(volumeDiscount, couponDiscount);
        } else if (appliedCoupon === 'BULK5') {
          couponDiscount = Math.min(5, subtotal);
          discount = volumeDiscount + couponDiscount;
        }

        var postDiscountSubtotal = Math.max(0, subtotal - discount);
        var shipping = appliedCoupon === 'FREESHIP' || postDiscountSubtotal >= 75 ? 0 : 8;
        var tax = postDiscountSubtotal * 0.0825;
        var total = postDiscountSubtotal + shipping + tax;

        document.getElementById('out-subtotal').textContent = money(subtotal);
        document.getElementById('out-discount').textContent = money(discount);
        document.getElementById('out-shipping').textContent = money(shipping);
        document.getElementById('out-tax').textContent = money(tax);
        document.getElementById('out-total').textContent = money(total);
      }

      products.forEach(function (product) {
        document.getElementById(product.id).addEventListener('input', calculate);
      });

      document.getElementById('app-apply').addEventListener('click', function () {
        var code = couponInput.value.trim().toUpperCase();
        var valid = code === '' || code === 'SAVE10' || code === 'BULK5' || code === 'FREESHIP';
        if (!valid) {
          appliedCoupon = '';
          errorOutput.textContent = 'Invalid coupon';
        } else {
          appliedCoupon = code;
          errorOutput.textContent = '';
        }
        calculate();
      });

      calculate();
    }());
  </script>
</body>
</html>
