<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Pricing Engine</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f4f6f8; color: #17212b; }
    main { width: min(680px, calc(100% - 32px)); margin: 48px auto; }
    .card { background: #fff; border: 1px solid #dce2e8; border-radius: 12px; padding: 28px; box-shadow: 0 8px 24px rgba(20, 35, 50, .07); }
    h1 { margin: 0 0 24px; font-size: 1.65rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #e7ebef; text-align: left; }
    th { color: #52606d; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
    th:last-child, td:last-child { text-align: right; }
    input[type="number"], input[type="text"] { width: 100%; border: 1px solid #bbc5cf; border-radius: 6px; padding: 9px 10px; font: inherit; }
    input[type="number"] { max-width: 92px; }
    .coupon { display: flex; gap: 10px; margin: 24px 0 8px; }
    .coupon input { flex: 1; }
    button { border: 0; border-radius: 6px; background: #1769aa; color: #fff; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #125789; }
    #out-coupon-error { display: block; min-height: 1.3em; color: #b42318; font-size: .9rem; }
    .summary { margin-top: 20px; border-top: 2px solid #17212b; padding-top: 12px; }
    .summary p { display: flex; justify-content: space-between; gap: 16px; margin: 10px 0; }
    .summary p:last-child { margin-top: 16px; padding-top: 14px; border-top: 1px solid #dce2e8; font-size: 1.15rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Checkout</h1>
      <table>
        <thead>
          <tr><th>Item</th><th>Price</th><th>Quantity</th></tr>
        </thead>
        <tbody>
          <tr><td>Widget</td><td>$24.99</td><td><input id="qty-widget" type="number" min="0" step="1" value="0" aria-label="Widget quantity"></td></tr>
          <tr><td>Gadget</td><td>$79.50</td><td><input id="qty-gadget" type="number" min="0" step="1" value="0" aria-label="Gadget quantity"></td></tr>
          <tr><td>Doohickey</td><td>$12.25</td><td><input id="qty-doohickey" type="number" min="0" step="1" value="0" aria-label="Doohickey quantity"></td></tr>
        </tbody>
      </table>

      <div class="coupon">
        <input id="app-coupon" type="text" placeholder="Coupon code" aria-label="Coupon code">
        <button id="app-apply" type="button">Apply</button>
      </div>
      <span id="out-coupon-error" role="alert"></span>

      <div class="summary" aria-label="Order summary">
        <p><span>Subtotal</span><span id="out-subtotal">$0.00</span></p>
        <p><span>Discount</span><span id="out-discount">$0.00</span></p>
        <p><span>Shipping</span><span id="out-shipping">$8.00</span></p>
        <p><span>Tax</span><span id="out-tax">$0.00</span></p>
        <p><span>Total</span><span id="out-total">$8.00</span></p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const products = [
        { id: 'qty-widget', price: 24.99 },
        { id: 'qty-gadget', price: 79.50 },
        { id: 'qty-doohickey', price: 12.25 }
      ];
      let appliedCoupon = '';

      const money = value => '$' + value.toFixed(2);
      const quantity = element => {
        const value = Number(element.value);
        if (!Number.isFinite(value) || value < 0) return 0;
        return Math.floor(value);
      };

      function calculate() {
        const subtotal = products.reduce((sum, product) => {
          const input = document.getElementById(product.id);
          const qty = quantity(input);
          return sum + product.price * qty;
        }, 0);

        const volumeRate = subtotal >= 500 ? 0.15 : subtotal >= 250 ? 0.10 : subtotal >= 100 ? 0.05 : 0;
        const volumeDiscount = subtotal * volumeRate;
        let discount = volumeDiscount;
        let postDiscountSubtotal = subtotal - discount;

        if (appliedCoupon === 'SAVE10') {
          const couponDiscount = subtotal * 0.10;
          discount = Math.max(volumeDiscount, couponDiscount);
          postDiscountSubtotal = subtotal - discount;
        } else if (appliedCoupon === 'BULK5') {
          discount = volumeDiscount + Math.min(5, subtotal);
          postDiscountSubtotal = subtotal - discount;
        }

        const freeShipping = appliedCoupon === 'FREESHIP';
        const shipping = freeShipping || postDiscountSubtotal >= 75 ? 0 : 8;
        const tax = postDiscountSubtotal * 0.0825;
        const total = postDiscountSubtotal + shipping + tax;

        document.getElementById('out-subtotal').textContent = money(subtotal);
        document.getElementById('out-discount').textContent = money(discount);
        document.getElementById('out-shipping').textContent = money(shipping);
        document.getElementById('out-tax').textContent = money(tax);
        document.getElementById('out-total').textContent = money(total);
      }

      function normalizeQuantities() {
        products.forEach(product => {
          const input = document.getElementById(product.id);
          input.value = String(quantity(input));
        });
      }

      products.forEach(product => {
        document.getElementById(product.id).addEventListener('input', () => {
          normalizeQuantities();
          calculate();
        });
      });

      document.getElementById('app-apply').addEventListener('click', () => {
        const code = document.getElementById('app-coupon').value.trim().toUpperCase();
        const error = document.getElementById('out-coupon-error');
        if (code === '') {
          appliedCoupon = '';
          error.textContent = '';
        } else if (['SAVE10', 'BULK5', 'FREESHIP'].includes(code)) {
          appliedCoupon = code;
          error.textContent = '';
        } else {
          appliedCoupon = '';
          error.textContent = 'Invalid coupon';
        }
        calculate();
      });

      calculate();
    })();
  </script>
</body>
</html>
