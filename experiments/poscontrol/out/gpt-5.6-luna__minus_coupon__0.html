<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Pricing Engine</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 2rem; background: #f4f6f8; color: #1f2933; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem; background: #fff; border: 1px solid #d9e0e7; border-radius: 0.75rem; box-shadow: 0 0.25rem 1rem rgba(31, 41, 51, 0.08); }
    h1 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th, td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    input { box-sizing: border-box; padding: 0.5rem; border: 1px solid #aeb8c2; border-radius: 0.35rem; font: inherit; }
    input[type="number"] { width: 5rem; }
    .coupon { display: flex; gap: 0.5rem; align-items: center; }
    #app-coupon { flex: 1; }
    button { padding: 0.5rem 1rem; border: 0; border-radius: 0.35rem; background: #1769aa; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #125489; }
    #out-coupon-error { display: block; min-height: 1.5em; margin-top: 0.5rem; color: #b42318; }
    .summary { margin-top: 1.5rem; }
    .summary p { display: flex; justify-content: space-between; margin: 0.6rem 0; }
    .summary .total { padding-top: 0.75rem; border-top: 2px solid #1f2933; font-weight: 700; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <table>
      <thead>
        <tr><th>Item</th><th>Price</th><th>Quantity</th></tr>
      </thead>
      <tbody>
        <tr><td>Widget</td><td>$24.99</td><td><input id="qty-widget" type="number" min="0" step="1" value="0" aria-label="Widget quantity"></td></tr>
        <tr><td>Gadget</td><td>$79.50</td><td><input id="qty-gadget" type="number" min="0" step="1" value="0" aria-label="Gadget quantity"></td></tr>
        <tr><td>Doohickey</td><td>$12.25</td><td><input id="qty-doohickey" type="number" min="0" step="1" value="0" aria-label="Doohickey quantity"></td></tr>
      </tbody>
    </table>

    <div class="coupon">
      <label for="app-coupon">Coupon</label>
      <input id="app-coupon" type="text" autocomplete="off">
      <button id="app-apply" type="button">Apply</button>
    </div>
    <span id="out-coupon-error" role="alert"></span>

    <section class="summary" aria-label="Order summary">
      <p><span>Subtotal</span><span id="out-subtotal">$0.00</span></p>
      <p><span>Discount</span><span id="out-discount">$0.00</span></p>
      <p><span>Shipping</span><span id="out-shipping">$8.00</span></p>
      <p><span>Tax</span><span id="out-tax">$0.00</span></p>
      <p class="total"><span>Total</span><span id="out-total">$8.00</span></p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var products = [
        { input: document.getElementById('qty-widget'), price: 24.99 },
        { input: document.getElementById('qty-gadget'), price: 79.50 },
        { input: document.getElementById('qty-doohickey'), price: 12.25 }
      ];
      var couponInput = document.getElementById('app-coupon');
      var couponError = document.getElementById('out-coupon-error');
      var appliedCoupon = '';

      function money(value) {
        return '$' + value.toFixed(2);
      }

      function quantity(input) {
        var value = Number(input.value);
        if (!Number.isFinite(value) || value < 0) {
          value = 0;
        }
        value = Math.floor(value);
        input.value = String(value);
        return value;
      }

      function render() {
        var subtotal = 0;
        products.forEach(function (product) {
          subtotal += product.price * quantity(product.input);
        });

        var volumeRate = subtotal >= 500 ? 0.15 : subtotal >= 250 ? 0.10 : subtotal >= 100 ? 0.05 : 0;
        var volumeDiscount = subtotal * volumeRate;
        var postVolume = subtotal - volumeDiscount;
        var couponDiscount = 0;
        var freeShipping = appliedCoupon === 'FREESHIP';

        if (appliedCoupon === 'SAVE10') {
          couponDiscount = postVolume * 0.10;
        } else if (appliedCoupon === 'BULK5') {
          couponDiscount = 5;
        }
        couponDiscount = Math.min(couponDiscount, postVolume);
        var discount = volumeDiscount + couponDiscount;
        var postDiscount = subtotal - discount;
        var shipping = freeShipping || postDiscount >= 75 ? 0 : 8;
        var tax = postDiscount * 0.0825;
        var total = postDiscount + shipping + tax;

        document.getElementById('out-subtotal').textContent = money(subtotal);
        document.getElementById('out-discount').textContent = money(discount);
        document.getElementById('out-shipping').textContent = money(shipping);
        document.getElementById('out-tax').textContent = money(tax);
        document.getElementById('out-total').textContent = money(total);
      }

      document.getElementById('app-apply').addEventListener('click', function () {
        var code = couponInput.value.trim().toUpperCase();
        var valid = code === '' || code === 'SAVE10' || code === 'BULK5' || code === 'FREESHIP';
        if (valid) {
          appliedCoupon = code;
          couponError.textContent = '';
        } else {
          appliedCoupon = '';
          couponError.textContent = 'Invalid coupon';
        }
        render();
      });

      products.forEach(function (product) {
        product.input.addEventListener('input', render);
        product.input.addEventListener('change', render);
      });

      render();
    }());
  </script>
</body>
</html>
