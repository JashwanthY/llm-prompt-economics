<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Pricing Engine</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
    th, td { padding: .65rem; border-bottom: 1px solid #ddd; text-align: left; }
    td:last-child, th:last-child { text-align: right; }
    input[type="number"] { width: 5rem; padding: .35rem; }
    input[type="text"] { padding: .4rem; }
    button { padding: .42rem .75rem; }
    #out-coupon-error { color: #b00020; margin-left: .5rem; }
    .totals { margin-left: auto; width: min(100%, 300px); }
    .totals div { display: flex; justify-content: space-between; padding: .35rem 0; }
    .totals .grand-total { font-weight: bold; border-top: 2px solid #222; margin-top: .35rem; padding-top: .65rem; }
  </style>
</head>
<body>
  <h1>Checkout</h1>

  <table>
    <thead><tr><th>Item</th><th>Price</th><th>Quantity</th></tr></thead>
    <tbody>
      <tr><td>Widget</td><td>$24.99</td><td><input id="qty-widget" type="number" min="0" step="1" value="0" aria-label="Widget quantity"></td></tr>
      <tr><td>Gadget</td><td>$79.50</td><td><input id="qty-gadget" type="number" min="0" step="1" value="0" aria-label="Gadget quantity"></td></tr>
      <tr><td>Doohickey</td><td>$12.25</td><td><input id="qty-doohickey" type="number" min="0" step="1" value="0" aria-label="Doohickey quantity"></td></tr>
    </tbody>
  </table>

  <p>
    <label for="app-coupon">Coupon</label>
    <input id="app-coupon" type="text" autocomplete="off">
    <button id="app-apply" type="button">Apply</button>
    <span id="out-coupon-error" aria-live="polite"></span>
  </p>

  <section class="totals" aria-label="Order totals">
    <div><span>Subtotal</span><span id="out-subtotal">$0.00</span></div>
    <div><span>Discount</span><span id="out-discount">$0.00</span></div>
    <div><span>Shipping</span><span id="out-shipping">$0.00</span></div>
    <div><span>Tax</span><span id="out-tax">$0.00</span></div>
    <div class="grand-total"><span>Total</span><span id="out-total">$0.00</span></div>
  </section>

  <script>
    (() => {
      const products = [
        { input: document.getElementById('qty-widget'), price: 24.99 },
        { input: document.getElementById('qty-gadget'), price: 79.50 },
        { input: document.getElementById('qty-doohickey'), price: 12.25 }
      ];
      const couponInput = document.getElementById('app-coupon');
      const couponError = document.getElementById('out-coupon-error');
      let appliedCoupon = '';

      const money = value => '$' + value.toFixed(2);
      const quantity = input => {
        const value = Number(input.value);
        return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
      };

      function update() {
        const subtotal = products.reduce((sum, product) => sum + product.price * quantity(product.input), 0);
        let volumeRate = 0;
        if (subtotal >= 500) volumeRate = 0.15;
        else if (subtotal >= 250) volumeRate = 0.10;
        else if (subtotal >= 100) volumeRate = 0.05;

        const volumeDiscount = subtotal * volumeRate;
        let couponDiscount = 0;
        const postVolumeSubtotal = subtotal - volumeDiscount;
        if (appliedCoupon === 'SAVE10') couponDiscount = postVolumeSubtotal * 0.10;
        else if (appliedCoupon === 'BULK5') couponDiscount = Math.min(5, postVolumeSubtotal);

        const discount = volumeDiscount + couponDiscount;
        const postDiscountSubtotal = subtotal - discount;
        const shipping = appliedCoupon === 'FREESHIP' || postDiscountSubtotal >= 75 ? 0 : 8;
        const tax = postDiscountSubtotal * 0.0825;
        const total = postDiscountSubtotal + shipping + tax;

        document.getElementById('out-subtotal').textContent = money(subtotal);
        document.getElementById('out-discount').textContent = money(discount);
        document.getElementById('out-shipping').textContent = money(shipping);
        document.getElementById('out-tax').textContent = money(tax);
        document.getElementById('out-total').textContent = money(total);
      }

      function applyCoupon() {
        const code = couponInput.value.trim().toUpperCase();
        if (code === '' || code === 'SAVE10' || code === 'BULK5' || code === 'FREESHIP') {
          appliedCoupon = code;
          couponError.textContent = '';
        } else {
          appliedCoupon = '';
          couponError.textContent = 'Invalid coupon';
        }
        update();
      }

      products.forEach(({ input }) => input.addEventListener('input', update));
      document.getElementById('app-apply').addEventListener('click', applyCoupon);
      couponInput.addEventListener('keydown', event => { if (event.key === 'Enter') applyCoupon(); });
      update();
    })();
  </script>
</body>
</html>
