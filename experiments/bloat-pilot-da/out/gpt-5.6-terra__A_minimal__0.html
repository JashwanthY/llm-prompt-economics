<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Knowledge Quiz</title>
  <style>
    :root { --ink: #1d2a3a; --blue: #1769aa; --light: #f3f7fb; --line: #c9d7e5; --good: #176b45; --bad: #a12b2b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--light); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 40px auto; padding: 32px; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px #19324a18; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 20px; color: #4a5b6b; }
    #progress { display: inline-block; margin-bottom: 24px; padding: 6px 11px; border-radius: 999px; background: #e3f0fb; color: #15558a; font-weight: 700; }
    fieldset { margin: 0 0 22px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; }
    legend { padding: 0 6px; font-weight: 700; }
    .options { display: grid; gap: 9px; margin-top: 8px; }
    label { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
    label:hover { background: #f1f7fc; }
    input { accent-color: var(--blue); width: 18px; height: 18px; }
    button { padding: 10px 18px; border: 0; border-radius: 7px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #94a5b5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #f6b73c; outline-offset: 2px; }
    #results { margin-top: 28px; padding: 20px; border-radius: 10px; background: #f7fafc; }
    #results h2 { margin-top: 0; }
    .wrong { margin: 14px 0; padding: 14px; border-left: 4px solid var(--bad); background: #fff; }
    .wrong p { margin: 5px 0; }
    .chosen { color: var(--bad); }
    .correct { color: var(--good); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Quick Knowledge Quiz</h1>
    <p class="intro">Choose one answer for each question.</p>
    <p id="progress" aria-live="polite">0 of 5 answered</p>

    <form id="quiz" novalidate>
      <fieldset>
        <legend>1. Which planet is known as the Red Planet?</legend>
        <div class="options">
          <label><input type="radio" name="q1" value="Venus"> Venus</label>
          <label><input type="radio" name="q1" value="Mars"> Mars</label>
          <label><input type="radio" name="q1" value="Jupiter"> Jupiter</label>
          <label><input type="radio" name="q1" value="Mercury"> Mercury</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>2. What is the largest ocean on Earth?</legend>
        <div class="options">
          <label><input type="radio" name="q2" value="Atlantic Ocean"> Atlantic Ocean</label>
          <label><input type="radio" name="q2" value="Indian Ocean"> Indian Ocean</label>
          <label><input type="radio" name="q2" value="Pacific Ocean"> Pacific Ocean</label>
          <label><input type="radio" name="q2" value="Arctic Ocean"> Arctic Ocean</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>3. Which element has the chemical symbol O?</legend>
        <div class="options">
          <label><input type="radio" name="q3" value="Gold"> Gold</label>
          <label><input type="radio" name="q3" value="Oxygen"> Oxygen</label>
          <label><input type="radio" name="q3" value="Osmium"> Osmium</label>
          <label><input type="radio" name="q3" value="Hydrogen"> Hydrogen</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>4. How many sides does a hexagon have?</legend>
        <div class="options">
          <label><input type="radio" name="q4" value="Five"> Five</label>
          <label><input type="radio" name="q4" value="Six"> Six</label>
          <label><input type="radio" name="q4" value="Seven"> Seven</label>
          <label><input type="radio" name="q4" value="Eight"> Eight</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>5. Who wrote <em>Romeo and Juliet</em>?</legend>
        <div class="options">
          <label><input type="radio" name="q5" value="Charles Dickens"> Charles Dickens</label>
          <label><input type="radio" name="q5" value="Jane Austen"> Jane Austen</label>
          <label><input type="radio" name="q5" value="William Shakespeare"> William Shakespeare</label>
          <label><input type="radio" name="q5" value="Mark Twain"> Mark Twain</label>
        </div>
      </fieldset>
      <button id="submit" type="submit" disabled>Submit Quiz</button>
    </form>

    <section id="results" hidden aria-live="polite" tabindex="-1">
      <h2 id="score"></h2>
      <div id="feedback"></div>
      <button id="retry" type="button">Retry Quiz</button>
    </section>
  </main>

  <script>
    const quiz = document.getElementById('quiz');
    const progress = document.getElementById('progress');
    const submit = document.getElementById('submit');
    const results = document.getElementById('results');
    const score = document.getElementById('score');
    const feedback = document.getElementById('feedback');
    const retry = document.getElementById('retry');
    const questions = [
      { name: 'q1', text: 'Which planet is known as the Red Planet?', correct: 'Mars' },
      { name: 'q2', text: 'What is the largest ocean on Earth?', correct: 'Pacific Ocean' },
      { name: 'q3', text: 'Which element has the chemical symbol O?', correct: 'Oxygen' },
      { name: 'q4', text: 'How many sides does a hexagon have?', correct: 'Six' },
      { name: 'q5', text: 'Who wrote Romeo and Juliet?', correct: 'William Shakespeare' }
    ];

    function updateProgress() {
      const answered = questions.filter(q => quiz.elements[q.name].value).length;
      progress.textContent = `${answered} of ${questions.length} answered`;
      submit.disabled = answered !== questions.length;
    }

    quiz.addEventListener('change', updateProgress);

    quiz.addEventListener('submit', event => {
      event.preventDefault();
      let total = 0;
      feedback.innerHTML = '';
      questions.forEach(q => {
        const chosen = quiz.elements[q.name].value;
        if (chosen === q.correct) {
          total++;
        } else {
          const item = document.createElement('article');
          item.className = 'wrong';
          item.innerHTML = `<strong>${q.text}</strong><p class="chosen">Your answer: ${chosen}</p><p class="correct">Correct answer: ${q.correct}</p>`;
          feedback.appendChild(item);
        }
      });
      score.textContent = `You scored ${total}/5`;
      if (total === questions.length) feedback.innerHTML = '<p>Excellent work — every answer is correct.</p>';
      results.hidden = false;
      results.focus();
    });

    retry.addEventListener('click', () => {
      quiz.reset();
      results.hidden = true;
      feedback.innerHTML = '';
      updateProgress();
      document.querySelector('input[name="q1"]').focus();
    });
  </script>
</body>
</html>
