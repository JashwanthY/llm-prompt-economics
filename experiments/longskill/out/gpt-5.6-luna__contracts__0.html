<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory</title>
  <style>
    :root {
      --ds-bg: #f4f7fb;
      --ds-surface: #ffffff;
      --ds-border: #d9e2ec;
      --ds-text: #1f2937;
      --ds-muted: #64748b;
      --ds-accent: #2563eb;
      --ds-accent-contrast: #ffffff;
      --ds-focus: #93c5fd;
      --ds-row-hover: #eff6ff;
      --ds-success: #166534;
      --ds-danger: #991b1b;
      --ds-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ds-bg);
      color: var(--ds-text);
    }

    .ds-page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .ds-page-header { margin-bottom: 24px; }
    .ds-page-header h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3vw, 2.25rem); }
    .ds-page-header p { margin: 0; color: var(--ds-muted); }

    .ds-toolbar,
    .ds-filterbar,
    .ds-grid,
    .ds-pager {
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      box-shadow: var(--ds-shadow);
    }

    .ds-toolbar {
      border-radius: 12px 12px 0 0;
      border-bottom: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .ds-toolbar h2,
    .ds-filterbar h2,
    .ds-pager h2,
    .ds-empty h2 { margin: 0; font-size: 1rem; }

    .ds-toolbar [data-role="toolbar-actions"] { display: flex; align-items: center; gap: 12px; }

    .ds-filterbar {
      padding: 16px 20px;
      border-bottom: 0;
      display: flex;
      align-items: end;
      gap: 20px;
      flex-wrap: wrap;
    }

    .ds-filterbar h2,
    .ds-pager h2 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .ds-filterbar [data-role="filterbar-facets"] { display: flex; align-items: end; gap: 20px; flex-wrap: wrap; width: 100%; }

    .ds-field { display: grid; gap: 6px; min-width: min(100%, 280px); }
    .ds-field label, .ds-checkbox-label { font-size: 0.875rem; font-weight: 600; }
    input[type="search"] {
      width: 100%;
      border: 1px solid var(--ds-border);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--ds-text);
      background: var(--ds-surface);
      font: inherit;
    }
    input[type="search"]:focus-visible,
    button:focus-visible { outline: 3px solid var(--ds-focus); outline-offset: 2px; }
    .ds-checkbox-label { display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--ds-accent); }

    button {
      border: 1px solid var(--ds-border);
      border-radius: 7px;
      background: var(--ds-surface);
      color: var(--ds-text);
      padding: 9px 13px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--ds-row-hover); }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .ds-primary { background: var(--ds-accent); color: var(--ds-accent-contrast); border-color: var(--ds-accent); }
    .ds-primary:hover:not(:disabled) { background: var(--ds-accent); color: var(--ds-accent-contrast); }

    .ds-grid { overflow-x: auto; min-height: 360px; }
    .ds-grid table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .ds-grid th, .ds-grid td { padding: 14px 20px; border-bottom: 1px solid var(--ds-border); text-align: left; }
    .ds-grid th { background: var(--ds-bg); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .ds-grid th button { padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; font-weight: 700; text-transform: inherit; letter-spacing: inherit; }
    .ds-grid th button:hover:not(:disabled) { background: transparent; color: var(--ds-accent); }
    .ds-grid tbody tr:hover { background: var(--ds-row-hover); }
    .ds-grid tbody tr:last-child td { border-bottom: 0; }
    .ds-status-active { color: var(--ds-success); font-weight: 700; }
    .ds-status-inactive { color: var(--ds-danger); font-weight: 700; }

    .ds-empty { padding: 72px 20px; text-align: center; color: var(--ds-muted); }
    .ds-empty [data-role="empty-message"] { margin-top: 8px; }

    .ds-pager {
      border-top: 0;
      border-radius: 0 0 12px 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .ds-pager [data-role="pager-pages"] { display: flex; align-items: center; gap: 10px; }
    .ds-count { color: var(--ds-muted); font-size: 0.9rem; }

    @media (max-width: 650px) {
      .ds-page { width: min(100% - 20px, 1180px); padding: 24px 0; }
      .ds-toolbar { align-items: stretch; flex-direction: column; }
      .ds-toolbar [data-role="toolbar-actions"] button { width: 100%; }
      .ds-filterbar, .ds-pager { padding: 14px; }
      .ds-grid th, .ds-grid td { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main class="ds-page">
    <header class="ds-page-header">
      <h1>Employee Directory</h1>
      <p>Browse, filter, sort, and export employee records.</p>
    </header>

    <section class="ds-toolbar" data-component="Toolbar" aria-labelledby="ds-toolbar-title">
      <h2 id="ds-toolbar-title">Employee records</h2>
      <div data-role="toolbar-actions">
        <button type="button" class="ds-primary" id="ds-export-button" data-testid="export-csv">Export CSV</button>
      </div>
    </section>

    <section class="ds-filterbar" data-component="FilterBar" aria-labelledby="ds-filterbar-title">
      <h2 id="ds-filterbar-title">Filters</h2>
      <div data-role="filterbar-facets">
        <div class="ds-field">
          <label for="ds-filterbar-search">Search name or department</label>
          <input id="ds-filterbar-search" data-testid="employee-search" type="search" placeholder="e.g. Engineering" autocomplete="off">
        </div>
        <label class="ds-checkbox-label" for="ds-filterbar-active">
          <input id="ds-filterbar-active" data-testid="active-only" type="checkbox">
          Active only
        </label>
      </div>
    </section>

    <section class="ds-grid" data-component="DataGrid" aria-labelledby="ds-grid-title">
      <h2 id="ds-grid-title" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Employee data table</h2>
      <table>
        <thead>
          <tr>
            <th scope="col"><button type="button" data-sort="name" data-testid="sort-name">Name <span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" data-sort="department" data-testid="sort-department">Department <span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" data-sort="salary" data-testid="sort-salary">Salary <span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" data-sort="startDate" data-testid="sort-start-date">Start date <span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" data-sort="active" data-testid="sort-active">Status <span aria-hidden="true"></span></button></th>
          </tr>
        </thead>
        <tbody data-role="grid-rows"></tbody>
      </table>
      <div class="ds-empty" data-component="EmptyState" aria-labelledby="ds-empty-title" hidden>
        <h2 id="ds-empty-title">No employees found</h2>
        <div data-role="empty-message">Try changing the search or active-only filter.</div>
      </div>
    </section>

    <nav class="ds-pager" data-component="Pager" aria-labelledby="ds-pager-title">
      <h2 id="ds-pager-title">Table pagination</h2>
      <div class="ds-count" id="ds-pager-count" aria-live="polite">Showing 0-0 of 0</div>
      <div data-role="pager-pages">
        <button type="button" id="ds-pager-previous" data-testid="previous-page">Previous</button>
        <span id="ds-pager-indicator" aria-live="polite">Page 1 of 1</span>
        <button type="button" id="ds-pager-next" data-testid="next-page">Next</button>
      </div>
    </nav>
  </main>

  <script>
    'use strict';

    const employees = [
      { name: 'Aisha Patel', department: 'Engineering', salary: 128000, startDate: '2020-03-16', active: true },
      { name: 'Marcus Chen', department: 'Sales', salary: 94000, startDate: '2021-07-12', active: true },
      { name: 'Elena Rodriguez', department: 'Support', salary: 72000, startDate: '2019-11-04', active: true },
      { name: 'Noah Williams', department: 'Design', salary: 101000, startDate: '2022-01-24', active: true },
      { name: 'Priya Nair', department: 'Engineering', salary: 137000, startDate: '2018-06-18', active: true },
      { name: 'Daniel Brooks', department: 'Sales', salary: 88000, startDate: '2023-02-06', active: true },
      { name: 'Sofia Kim', department: 'Support', salary: 76000, startDate: '2020-09-21', active: false },
      { name: 'Lucas Martin', department: 'Design', salary: 97000, startDate: '2021-04-19', active: true },
      { name: 'Grace Thompson', department: 'Engineering', salary: 119000, startDate: '2022-08-08', active: true },
      { name: 'Owen Davis', department: 'Sales', salary: 91000, startDate: '2020-12-14', active: false },
      { name: 'Mei Tanaka', department: 'Support', salary: 81000, startDate: '2017-10-02', active: true },
      { name: 'Ethan Wilson', department: 'Design', salary: 108000, startDate: '2019-05-13', active: true },
      { name: 'Fatima Hassan', department: 'Engineering', salary: 131000, startDate: '2023-06-05', active: true },
      { name: 'James Carter', department: 'Sales', salary: 99000, startDate: '2018-09-10', active: true },
      { name: 'Isabella Rossi', department: 'Support', salary: 74500, startDate: '2022-11-28', active: true },
      { name: 'Henry Adams', department: 'Design', salary: 112000, startDate: '2020-01-27', active: false },
      { name: 'Chloe Nguyen', department: 'Engineering', salary: 124000, startDate: '2021-10-11', active: true },
      { name: 'Benjamin Scott', department: 'Sales', salary: 86000, startDate: '2023-09-18', active: true },
      { name: 'Layla Ahmed', department: 'Support', salary: 79000, startDate: '2019-02-25', active: true },
      { name: 'William Turner', department: 'Design', salary: 103000, startDate: '2022-05-16', active: true },
      { name: 'Nina Gupta', department: 'Engineering', salary: 142000, startDate: '2017-03-06', active: false },
      { name: 'Samuel Reed', department: 'Sales', salary: 93500, startDate: '2021-12-06', active: true },
      { name: 'Amara Okafor', department: 'Support', salary: 83500, startDate: '2020-06-22', active: true },
      { name: 'Theo Morgan', department: 'Design', salary: 106000, startDate: '2023-01-09', active: true }
    ];

    const state = { page: 1, sortKey: null, sortDirection: 'asc', pageSize: 10 };
    const searchInput = document.getElementById('ds-filterbar-search');
    const activeOnlyInput = document.getElementById('ds-filterbar-active');
    const rowsContainer = document.querySelector('[data-role="grid-rows"]');
    const emptyState = document.querySelector('[data-component="EmptyState"]');
    const countLine = document.getElementById('ds-pager-count');
    const pageIndicator = document.getElementById('ds-pager-indicator');
    const previousButton = document.getElementById('ds-pager-previous');
    const nextButton = document.getElementById('ds-pager-next');

    function getFilteredEmployees() {
      const query = searchInput.value.trim().toLowerCase();
      return employees.filter((employee) => {
        const matchesText = !query || employee.name.toLowerCase().includes(query) || employee.department.toLowerCase().includes(query);
        return matchesText && (!activeOnlyInput.checked || employee.active);
      });
    }

    function getSortedEmployees(records) {
      if (!state.sortKey) return records.slice();
      return records.slice().sort((first, second) => {
        let comparison;
        if (state.sortKey === 'active') {
          comparison = Number(first.active) - Number(second.active);
        } else if (state.sortKey === 'salary') {
          comparison = first.salary - second.salary;
        } else if (state.sortKey === 'startDate') {
          comparison = first.startDate.localeCompare(second.startDate);
        } else {
          comparison = first[state.sortKey].localeCompare(second[state.sortKey]);
        }
        return state.sortDirection === 'asc' ? comparison : -comparison;
      });
    }

    function formatSalary(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(value);
    }

    function addCell(row, text, className) {
      const cell = document.createElement('td');
      cell.textContent = text;
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    function render() {
      const filtered = getSortedEmployees(getFilteredEmployees());
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      const startIndex = (state.page - 1) * state.pageSize;
      const visible = filtered.slice(startIndex, startIndex + state.pageSize);

      rowsContainer.replaceChildren();
      visible.forEach((employee) => {
        const row = document.createElement('tr');
        addCell(row, employee.name);
        addCell(row, employee.department);
        addCell(row, formatSalary(employee.salary));
        addCell(row, employee.startDate);
        addCell(row, employee.active ? 'Active' : 'Inactive', employee.active ? 'ds-status-active' : 'ds-status-inactive');
        rowsContainer.appendChild(row);
      });
      emptyState.hidden = filtered.length !== 0;
      document.querySelector('.ds-grid table').hidden = filtered.length === 0;

      const firstShown = filtered.length === 0 ? 0 : startIndex + 1;
      const lastShown = filtered.length === 0 ? 0 : startIndex + visible.length;
      countLine.textContent = `Showing ${firstShown}-${lastShown} of ${filtered.length}`;
      pageIndicator.textContent = `Page ${state.page} of ${totalPages}`;
      previousButton.disabled = state.page === 1;
      nextButton.disabled = state.page === totalPages;
      updateSortLabels();
    }

    function updateSortLabels() {
      document.querySelectorAll('[data-sort]').forEach((button) => {
        const indicator = button.querySelector('span');
        const isCurrent = button.dataset.sort === state.sortKey;
        indicator.textContent = isCurrent ? (state.sortDirection === 'asc' ? ' ▲' : ' ▼') : '';
        button.setAttribute('aria-label', `${button.textContent.trim().replace(/ [▲▼]$/, '')}${isCurrent ? `, sorted ${state.sortDirection}ending` : ', sort'}`);
      });
    }

    function csvEscape(value) {
      const text = String(value);
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const filtered = getSortedEmployees(getFilteredEmployees());
      const headers = ['Name', 'Department', 'Salary', 'Start Date', 'Active'];
      const lines = [headers, ...filtered.map((employee) => [employee.name, employee.department, employee.salary, employee.startDate, employee.active])]
        .map((line) => line.map(csvEscape).join(','));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'employees.csv';
      link.dataset.testid = 'csv-download-link';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    searchInput.addEventListener('input', () => { state.page = 1; render(); });
    activeOnlyInput.addEventListener('change', () => { state.page = 1; render(); });
    previousButton.addEventListener('click', () => { if (state.page > 1) { state.page -= 1; render(); } });
    nextButton.addEventListener('click', () => { const pages = Math.max(1, Math.ceil(getFilteredEmployees().length / state.pageSize)); if (state.page < pages) { state.page += 1; render(); } });
    document.getElementById('ds-export-button').addEventListener('click', exportCsv);
    document.querySelectorAll('[data-sort]').forEach((button) => {
      button.addEventListener('click', () => {
        if (state.sortKey === button.dataset.sort) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
        else { state.sortKey = button.dataset.sort; state.sortDirection = 'asc'; }
        state.page = 1;
        render();
      });
    });

    render();
  </script>
</body>
</html>
