<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Directory</title>
<style>
  body { font-family: Arial, sans-serif; margin: 32px; color: #222; }
  h1 { margin-top: 0; }
  .controls { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; }
  label { display: flex; gap: 7px; align-items: center; }
  input[type="text"] { padding: 7px; width: 250px; }
  button { padding: 7px 12px; cursor: pointer; }
  button:disabled { cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 9px; text-align: left; }
  th { background: #f2f2f2; }
  th button { border: 0; background: none; padding: 0; font: inherit; font-weight: bold; }
  .status { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
  .pagination { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<h1>Employee Directory</h1>
<div class="controls">
  <label>Filter <input id="filter" type="text" placeholder="Name or department"></label>
  <label><input id="activeOnly" type="checkbox"> Active only</label>
  <button id="exportCsv" type="button">Export CSV</button>
</div>
<table>
  <thead>
    <tr>
      <th><button type="button" data-column="name">Name <span></span></button></th>
      <th><button type="button" data-column="department">Department <span></span></button></th>
      <th><button type="button" data-column="salary">Salary <span></span></button></th>
      <th><button type="button" data-column="startDate">Start Date <span></span></button></th>
      <th><button type="button" data-column="active">Active <span></span></button></th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
<div class="status">
  <div id="rowCount"></div>
  <div class="pagination">
    <button id="previous" type="button">Previous</button>
    <span id="pageIndicator"></span>
    <button id="next" type="button">Next</button>
  </div>
</div>
<script>
const employees = [
  { name: 'Ava Martinez', department: 'Engineering', salary: 112000, startDate: '2019-03-18', active: true },
  { name: 'Liam Chen', department: 'Sales', salary: 86000, startDate: '2021-07-12', active: true },
  { name: 'Noah Williams', department: 'Support', salary: 62000, startDate: '2020-11-02', active: false },
  { name: 'Emma Johnson', department: 'Design', salary: 94000, startDate: '2018-05-25', active: true },
  { name: 'Oliver Brown', department: 'Engineering', salary: 128000, startDate: '2017-09-14', active: true },
  { name: 'Sophia Davis', department: 'Sales', salary: 79000, startDate: '2022-01-10', active: true },
  { name: 'Elijah Wilson', department: 'Support', salary: 68000, startDate: '2019-08-07', active: true },
  { name: 'Isabella Moore', department: 'Design', salary: 101000, startDate: '2020-02-21', active: false },
  { name: 'James Taylor', department: 'Engineering', salary: 119000, startDate: '2021-04-30', active: true },
  { name: 'Mia Anderson', department: 'Sales', salary: 83000, startDate: '2018-12-03', active: true },
  { name: 'Benjamin Thomas', department: 'Support', salary: 71000, startDate: '2023-06-15', active: true },
  { name: 'Charlotte Jackson', department: 'Design', salary: 97000, startDate: '2019-10-28', active: true },
  { name: 'Lucas White', department: 'Engineering', salary: 108000, startDate: '2022-08-19', active: false },
  { name: 'Amelia Harris', department: 'Sales', salary: 91000, startDate: '2020-06-09', active: true },
  { name: 'Henry Martin', department: 'Support', salary: 65000, startDate: '2017-04-17', active: true },
  { name: 'Harper Thompson', department: 'Design', salary: 105000, startDate: '2021-11-23', active: true },
  { name: 'Alexander Garcia', department: 'Engineering', salary: 134000, startDate: '2018-01-08', active: true },
  { name: 'Evelyn Martinez', department: 'Sales', salary: 76000, startDate: '2023-02-14', active: false },
  { name: 'Daniel Robinson', department: 'Support', salary: 69000, startDate: '2020-09-01', active: true },
  { name: 'Abigail Clark', department: 'Design', salary: 99000, startDate: '2019-07-16', active: true },
  { name: 'Matthew Rodriguez', department: 'Engineering', salary: 116000, startDate: '2022-03-11', active: true },
  { name: 'Ella Lewis', department: 'Sales', salary: 88000, startDate: '2018-08-22', active: true },
  { name: 'Joseph Lee', department: 'Support', salary: 64000, startDate: '2021-05-06', active: false },
  { name: 'Grace Walker', department: 'Design', salary: 93000, startDate: '2023-09-29', active: true }
];

const pageSize = 10;
let currentPage = 1;
let sortColumn = null;
let sortDirection = 'asc';

const filterInput = document.getElementById('filter');
const activeOnly = document.getElementById('activeOnly');
const tableBody = document.getElementById('tableBody');
const rowCount = document.getElementById('rowCount');
const previous = document.getElementById('previous');
const next = document.getElementById('next');
const pageIndicator = document.getElementById('pageIndicator');

function filteredEmployees() {
  const query = filterInput.value.trim().toLowerCase();
  return employees.filter(employee =>
    (!query || employee.name.toLowerCase().includes(query) || employee.department.toLowerCase().includes(query)) &&
    (!activeOnly.checked || employee.active)
  );
}

function render() {
  const rows = filteredEmployees();
  if (sortColumn) {
    rows.sort((a, b) => {
      const first = a[sortColumn];
      const second = b[sortColumn];
      const comparison = typeof first === 'string' ? first.localeCompare(second) : Number(first) - Number(second);
      return sortDirection === 'asc' ? comparison : -comparison;
    });
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const visibleRows = rows.slice(start, start + pageSize);

  tableBody.innerHTML = visibleRows.map(employee => `<tr><td>${employee.name}</td><td>${employee.department}</td><td>${employee.salary}</td><td>${employee.startDate}</td><td>${employee.active ? 'Yes' : 'No'}</td></tr>`).join('');
  rowCount.textContent = rows.length ? `Showing ${start + 1}-${Math.min(start + pageSize, rows.length)} of ${rows.length}` : 'Showing 0-0 of 0';
  pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
  previous.disabled = currentPage === 1;
  next.disabled = currentPage === totalPages;
  document.querySelectorAll('th button').forEach(button => {
    button.querySelector('span').textContent = button.dataset.column === sortColumn ? (sortDirection === 'asc' ? '▲' : '▼') : '';
  });
}

filterInput.addEventListener('input', () => { currentPage = 1; render(); });
activeOnly.addEventListener('change', () => { currentPage = 1; render(); });
document.querySelectorAll('th button').forEach(button => button.addEventListener('click', () => {
  const column = button.dataset.column;
  if (sortColumn === column) sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
  else { sortColumn = column; sortDirection = 'asc'; }
  render();
}));
previous.addEventListener('click', () => { currentPage--; render(); });
next.addEventListener('click', () => { currentPage++; render(); });
document.getElementById('exportCsv').addEventListener('click', () => {
  const rows = filteredEmployees();
  const columns = ['name', 'department', 'salary', 'startDate', 'active'];
  const csv = [columns.join(','), ...rows.map(row => columns.map(column => {
    const value = String(row[column]);
    return value.includes(',') ? `"${value}"` : value;
  }).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'employees.csv';
  link.click();
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
