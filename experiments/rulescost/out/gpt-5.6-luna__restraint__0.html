<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      color: #222;
    }

    h1 {
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      padding: 0.5rem;
      width: 18rem;
    }

    button {
      padding: 0.5rem 0.8rem;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.65rem;
      text-align: left;
    }

    th {
      background: #f2f2f2;
      cursor: pointer;
      user-select: none;
    }

    .status {
      margin: 1rem 0;
    }

    .pagination {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Employee Directory</h1>

  <div class="controls">
    <label>
      Filter:
      <input id="filterInput" type="text" placeholder="Name or department">
    </label>
    <label>
      <input id="activeOnly" type="checkbox">
      Active only
    </label>
    <button id="exportButton" type="button">Export CSV</button>
  </div>

  <div id="rowCount" class="status"></div>

  <table>
    <thead>
      <tr>
        <th data-column="name">Name</th>
        <th data-column="department">Department</th>
        <th data-column="salary">Salary</th>
        <th data-column="startDate">Start Date</th>
        <th data-column="active">Active</th>
      </tr>
    </thead>
    <tbody id="employeeBody"></tbody>
  </table>

  <div class="pagination">
    <button id="previousButton" type="button">Previous</button>
    <span id="pageIndicator"></span>
    <button id="nextButton" type="button">Next</button>
  </div>

  <script>
    const employees = [
      { name: "Ava Patel", department: "Engineering", salary: 118000, startDate: "2020-02-17", active: true },
      { name: "Liam Carter", department: "Sales", salary: 86000, startDate: "2021-06-07", active: true },
      { name: "Mia Rodriguez", department: "Support", salary: 72000, startDate: "2019-09-23", active: true },
      { name: "Noah Kim", department: "Design", salary: 94000, startDate: "2022-01-10", active: true },
      { name: "Emma Thompson", department: "Engineering", salary: 126000, startDate: "2018-04-16", active: false },
      { name: "Oliver Williams", department: "Sales", salary: 91000, startDate: "2020-11-02", active: true },
      { name: "Sophia Nguyen", department: "Support", salary: 76000, startDate: "2023-03-13", active: true },
      { name: "Elijah Brown", department: "Design", salary: 101000, startDate: "2021-08-30", active: false },
      { name: "Isabella Garcia", department: "Engineering", salary: 113000, startDate: "2019-01-21", active: true },
      { name: "James Wilson", department: "Sales", salary: 83000, startDate: "2022-05-09", active: true },
      { name: "Charlotte Lee", department: "Support", salary: 69000, startDate: "2020-07-27", active: false },
      { name: "Benjamin Davis", department: "Design", salary: 97000, startDate: "2018-10-15", active: true },
      { name: "Amelia Martin", department: "Engineering", salary: 132000, startDate: "2017-03-06", active: true },
      { name: "Lucas Anderson", department: "Sales", salary: 88000, startDate: "2023-01-30", active: true },
      { name: "Harper Thomas", department: "Support", salary: 74000, startDate: "2021-12-06", active: true },
      { name: "Henry Moore", department: "Design", salary: 105000, startDate: "2019-06-24", active: false },
      { name: "Evelyn Jackson", department: "Engineering", salary: 121000, startDate: "2022-09-12", active: true },
      { name: "Alexander White", department: "Sales", salary: 95000, startDate: "2020-03-16", active: false },
      { name: "Ella Harris", department: "Support", salary: 78000, startDate: "2018-12-03", active: true },
      { name: "Daniel Clark", department: "Design", salary: 99000, startDate: "2023-07-17", active: true },
      { name: "Scarlett Lewis", department: "Engineering", salary: 116000, startDate: "2021-02-08", active: true },
      { name: "Matthew Walker", department: "Sales", salary: 89000, startDate: "2019-11-18", active: true },
      { name: "Grace Hall", department: "Support", salary: 71000, startDate: "2022-11-14", active: false },
      { name: "Michael Allen", department: "Design", salary: 108000, startDate: "2020-05-04", active: true }
    ];

    const rowsPerPage = 10;
    let currentPage = 1;
    let sortColumn = null;
    let sortDirection = "asc";

    const filterInput = document.getElementById("filterInput");
    const activeOnly = document.getElementById("activeOnly");
    const employeeBody = document.getElementById("employeeBody");
    const rowCount = document.getElementById("rowCount");
    const pageIndicator = document.getElementById("pageIndicator");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const exportButton = document.getElementById("exportButton");

    function getFilteredEmployees() {
      const query = filterInput.value.trim().toLowerCase();
      return employees.filter(employee => {
        const matchesText = employee.name.toLowerCase().includes(query) || employee.department.toLowerCase().includes(query);
        const matchesActive = !activeOnly.checked || employee.active;
        return matchesText && matchesActive;
      });
    }

    function getSortedEmployees(list) {
      if (!sortColumn) {
        return list;
      }
      return [...list].sort((a, b) => {
        let comparison;
        if (typeof a[sortColumn] === "number") {
          comparison = a[sortColumn] - b[sortColumn];
        } else if (typeof a[sortColumn] === "boolean") {
          comparison = Number(a[sortColumn]) - Number(b[sortColumn]);
        } else {
          comparison = String(a[sortColumn]).localeCompare(String(b[sortColumn]));
        }
        return sortDirection === "asc" ? comparison : -comparison;
      });
    }

    function updateHeaders() {
      document.querySelectorAll("th[data-column]").forEach(header => {
        const column = header.dataset.column;
        const labels = {
          name: "Name",
          department: "Department",
          salary: "Salary",
          startDate: "Start Date",
          active: "Active"
        };
        header.textContent = column === sortColumn ? labels[column] + (sortDirection === "asc" ? " ▲" : " ▼") : labels[column];
      });
    }

    function render() {
      const filteredEmployees = getSortedEmployees(getFilteredEmployees());
      const totalRows = filteredEmployees.length;
      const totalPages = Math.max(1, Math.ceil(totalRows / rowsPerPage));
      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const startIndex = (currentPage - 1) * rowsPerPage;
      const pageRows = filteredEmployees.slice(startIndex, startIndex + rowsPerPage);
      employeeBody.innerHTML = pageRows.map(employee => `
        <tr>
          <td>${employee.name}</td>
          <td>${employee.department}</td>
          <td>$${employee.salary.toLocaleString()}</td>
          <td>${employee.startDate}</td>
          <td>${employee.active ? "Yes" : "No"}</td>
        </tr>
      `).join("");

      const firstShown = totalRows === 0 ? 0 : startIndex + 1;
      const lastShown = Math.min(startIndex + rowsPerPage, totalRows);
      rowCount.textContent = `Showing ${firstShown}-${lastShown} of ${totalRows}`;
      pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
      previousButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
      updateHeaders();
    }

    document.querySelectorAll("th[data-column]").forEach(header => {
      header.addEventListener("click", () => {
        const column = header.dataset.column;
        if (sortColumn === column) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = column;
          sortDirection = "asc";
        }
        render();
      });
    });

    filterInput.addEventListener("input", () => {
      currentPage = 1;
      render();
    });

    activeOnly.addEventListener("change", () => {
      currentPage = 1;
      render();
    });

    previousButton.addEventListener("click", () => {
      currentPage -= 1;
      render();
    });

    nextButton.addEventListener("click", () => {
      currentPage += 1;
      render();
    });

    exportButton.addEventListener("click", () => {
      const filteredEmployees = getSortedEmployees(getFilteredEmployees());
      const headers = ["Name", "Department", "Salary", "Start Date", "Active"];
      const escapeCsv = value => {
        const text = String(value);
        return text.includes(",") || text.includes('"') || text.includes("\n") ? '"' + text.replace(/"/g, '""') + '"' : text;
      };
      const lines = [headers.join(",")];
      filteredEmployees.forEach(employee => {
        lines.push([
          employee.name,
          employee.department,
          employee.salary,
          employee.startDate,
          employee.active ? "Yes" : "No"
        ].map(escapeCsv).join(","));
      });
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "employees.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    render();
  </script>
</body>
</html>
